<style>
:root{--bg:#f6f4f9;--card:#fff;--ink:#1f1a2b;--muted:#6b6478;--line:#e6e1ee;--pri:#694997;--pri-ink:#fff;--pri2:#f0ebf6;--acc:#da5d30;--acc-ink:#fff;--acc2:#fcefe9;--lila:#cfbfde;--danger:#b42318;--danger2:#fdecea;--warn:#93370d;--warn2:#fff4e5;--ok:#067647;--ok2:#e7f6ec;--rad:14px;--shadow:0 1px 2px rgba(40,20,70,.05),0 1px 3px rgba(40,20,70,.08)}
@media (prefers-color-scheme: dark){:root{--bg:#141119;--card:#1e1a26;--ink:#ece8f2;--muted:#a59db3;--line:#322b3e;--pri:#b49ad9;--pri-ink:#1a1325;--pri2:#2b2338;--acc:#ef7a4f;--acc-ink:#1f0f08;--acc2:#3a2219;--danger:#f97066;--danger2:#3a1715;--warn:#fdb022;--warn2:#3a2a10;--ok:#47cd89;--ok2:#11301f;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--card);color:var(--ink);padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--acc);box-shadow:var(--shadow)}
header.top h1{font-size:15px;margin:0;flex:1;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px;font-weight:600;color:var(--muted)}
header.top button{background:var(--pri2);border:0;color:var(--pri);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:38px}
header.top button img,header.top button svg{width:20px;height:20px;flex:none}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.search{position:sticky;top:60px;z-index:10;background:var(--bg);padding:2px 0 12px}
.search input{width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:17px;outline:none}
.search input:focus{border-color:var(--pri)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list li:last-child{border-bottom:0}
.list li:hover{background:var(--pri2)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-weight:700;flex:none}
.name{font-weight:600}
.sub{color:var(--muted);font-size:14px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:600}
.pill.warn{background:var(--warn2);color:var(--warn)}
.pill.ok{background:var(--ok2);color:var(--ok)}
.pill.danger{background:var(--danger2);color:var(--danger)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
input.i,textarea.i,select.i{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none}
input.i:focus,textarea.i:focus,select.i:focus{border-color:var(--pri)}
textarea.i{resize:vertical;min-height:90px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.alert.danger{background:var(--danger2);color:var(--danger);font-weight:600}
.alert.warn{background:var(--warn2);color:var(--warn)}
.alert.info{background:var(--pri2);color:var(--ink)}
.evo{border-left:3px solid var(--acc);padding:6px 0 6px 12px;margin:0 0 14px}
.evo .meta{font-size:13px;color:var(--muted);margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.evo .txt{white-space:pre-wrap;word-wrap:break-word}
.dictbox{position:relative}
.dictbox textarea{min-height:150px;padding-bottom:12px;font-size:17px}
.mic{border:0;border-radius:50%;width:54px;height:54px;background:var(--acc);color:var(--acc-ink);cursor:pointer;display:grid;place-items:center;flex:none}
.mic svg{width:26px;height:26px}
.mic.on{background:var(--pri);color:var(--pri-ink);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(105,73,151,.55)}70%{box-shadow:0 0 0 14px rgba(105,73,151,0)}100%{box-shadow:0 0 0 0 rgba(105,73,151,0)}}
.interim{color:var(--muted);font-style:italic;min-height:1.4em;font-size:14px;margin-top:4px}
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.overlay{align-items:center}}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:640px){.modal{border-radius:18px}}
.modal h3{margin:0 0 14px;font-size:19px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.lock{min-height:100vh;display:grid;place-items:center;padding:16px}
.lock .card{width:100%;max-width:420px;padding:24px}
.lock h1{margin:0 0 6px;font-size:22px}
.toast{display:flex;align-items:center;gap:8px;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2430;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.menu{position:absolute;right:12px;top:54px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:30;min-width:230px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 16px;cursor:pointer;border-radius:0;color:var(--ink)}
.menu button:hover{background:var(--pri2)}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.hora{font-weight:700;font-variant-numeric:tabular-nums;min-width:52px}
details summary{cursor:pointer;font-weight:600}
a{color:var(--pri)}
#print{display:none}
.pdfdoc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.nun-cod{font-family:ui-monospace,monospace;font-weight:700;color:var(--pri)}
.nun-d{font-size:14px;margin-top:2px}
.nun-list li{align-items:flex-start}
.nun-list li.ya{opacity:.55}
.nun-add{font-size:20px;color:var(--pri);font-weight:700;padding:0 6px}
.nun-res{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 10px}
.nun-sel{margin-bottom:8px}
.nun-pick{display:flex;gap:8px;align-items:center;border:1px solid var(--pri);background:var(--pri2);border-radius:10px;padding:6px 8px;margin-bottom:6px;font-size:14px}
.nun-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.nun-chip{font-size:12.5px;background:var(--pri2);color:var(--ink);border-radius:8px;padding:3px 8px}
.nun-chip b{color:var(--pri);font-family:ui-monospace,monospace}
.nun-evo{margin-top:10px}.nun-evo summary{cursor:pointer;font-weight:600;color:var(--pri)}.nun-evo[open] summary{margin-bottom:8px}
.f .lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.stat-big{font-size:18px;margin:12px 0}.stat-big b{font-size:30px;color:var(--pri)}
.cxbars .row{margin:4px 0;font-size:14px;flex-wrap:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:14px;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}
.steps.tabs span[role=button]{cursor:pointer}
.certprev{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--bg);font-family:Georgia,serif;font-size:15px;line-height:1.55}
.certprev p{margin:0 0 8px;text-align:justify}
.pdfopts{display:flex;flex-direction:column;gap:8px}
.pdfopts .pillopt{width:100%}
.uso{margin:14px 0}
.uso .row{font-size:15px;gap:8px}
.uso-barra{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.uso-barra div{height:100%;border-radius:99px;transition:width .4s}
.uso-barra .verde{background:#12b76a}.uso-barra .naranja{background:#f79009}.uso-barra .rojo{background:#d92d20}
.luz{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.luz.espera{background:#f79009;box-shadow:0 0 0 3px rgba(247,144,9,.22);animation:titila 1.6s ease-in-out infinite}
.luz.atendido{background:#12b76a;box-shadow:0 0 0 3px rgba(18,183,106,.2)}
@keyframes titila{50%{box-shadow:0 0 0 6px rgba(247,144,9,.08)}}
li.tl-atendido .name{color:var(--muted)}
.pill.estado{border:0;cursor:pointer;padding:5px 10px;font-size:13px}
.conteo{font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;margin-left:8px;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.conteo .luz{width:9px;height:9px;animation:none;margin-left:6px}
.firma{font-size:12px;color:var(--pri);font-weight:600;background:var(--pri2);border-radius:99px;padding:1px 8px}
.invcode{background:var(--bg);border:1px dashed var(--pri);border-radius:10px;padding:10px;font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;user-select:all;-webkit-user-select:all}
.lstab{overflow:auto;max-height:55vh;border:1px solid var(--line);border-radius:10px}
.lstab table{width:100%;border-collapse:collapse;font-size:14px}
.lstab th,.lstab td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.lstab th{position:sticky;top:0;background:var(--card);color:var(--muted);font-size:12px;text-transform:uppercase}
.lstab input[type=checkbox]{width:20px;height:20px}
.modal.wide{max-width:980px}
.modal.full{max-width:none;width:100vw;height:100vh;max-height:100vh;border-radius:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.dv{outline:none}
.dv-series{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.dv-chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;font-size:13px;color:var(--ink)}
.dv-chip span{color:var(--muted);font-size:12px}
.dv-chip.on{border-color:var(--pri);background:var(--pri2)}
.dv-stage{position:relative;background:#000;border-radius:10px;display:block;height:min(62vh,720px);min-height:260px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.dv-stage canvas{position:absolute;left:0;top:0;max-width:none;max-height:none;display:block;touch-action:none;pointer-events:none}
.dv-stage{cursor:grab}
.dv-help{margin-top:6px;font-size:13px}
.modal.full .dv-stage{height:calc(100vh - 200px - env(safe-area-inset-bottom))}
.modal.full h3{margin-bottom:8px;font-size:16px}
.dv-stage .dv-tl,.dv-stage .dv-tr,.dv-stage .dv-bl,.dv-stage .dv-br{position:absolute;color:#e8e8e8;font:600 12px/1.3 system-ui;text-shadow:0 1px 2px #000;pointer-events:none}
.dv-tl{left:10px;top:8px}.dv-tr{right:10px;top:8px}.dv-bl{left:10px;bottom:8px}.dv-br{right:10px;bottom:8px}
.dv-msg{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);color:#fff;text-align:center;font-size:14px}
.dv-slider{width:100%;margin:10px 0 4px;accent-color:var(--pri)}
.dv-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dv-presets{display:contents}
.turnobox{background:var(--pri2);border-radius:12px;padding:10px 12px 2px;margin-bottom:14px}
.turnobox .tb-title{font-weight:700;color:var(--pri);margin-bottom:8px}
.grid2.keep2{grid-template-columns:1fr 1fr!important}
.actions.nowrap{flex-wrap:nowrap}
.actions.nowrap .btn.pri{flex:1}
.steps{display:flex;gap:6px;margin:-4px 0 12px;font-size:13px;font-weight:600}
.steps span{flex:1;text-align:center;padding:6px 4px;border-radius:8px;background:var(--bg);color:var(--muted)}
.steps span.on{background:var(--pri2);color:var(--pri)}
.howto{margin:0 0 10px;padding-left:20px}
.howto li{margin-bottom:2px}
.actions.sticky{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--card);padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-bottom:calc(-18px - env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:2}
.waorig{margin-bottom:12px;font-size:14px}
.waorig summary{color:var(--muted);font-weight:600}
.waorig div{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:6px}
.pw{position:relative;display:block}
.pw input{padding-right:48px!important}
.pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center;border-radius:8px}
.pw .eye:hover{color:var(--pri);background:var(--pri2)}
.pw .eye svg{width:22px;height:22px}
.adjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.adj{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.adj:hover{border-color:var(--pri)}
.adj .th{position:relative;aspect-ratio:4/3;background:#111;display:grid;place-items:center;font-size:42px}
.adj .th img{width:100%;height:100%;object-fit:cover}
.adj .tag{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;background:rgba(255,255,255,.92);color:#1f1a2b;border-radius:6px;padding:1px 6px}
.adj .tag.dcm{background:var(--acc);color:#fff}
.adj .cap{padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.adj .cap b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adj .cap span{color:var(--muted)}
.adjview{margin-bottom:6px}
table.dcm{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
table.dcm td{padding:5px 4px;border-bottom:1px solid var(--line)}
table.dcm td:first-child{color:var(--muted);width:45%}
@media (hover:none){.desk{display:none}}
header.top button.warn{background:var(--acc2);color:var(--acc)}
.hlogo{height:30px;width:auto;display:block}
.logochip{display:inline-flex;align-items:center}
@media (prefers-color-scheme: dark){.logochip{background:#fff;border-radius:8px;padding:4px 8px}}
.htitle{border-left:2px solid var(--line);padding-left:10px}
@media (max-width:620px){header.top .lbl,header.top .htitle{display:none}header.top{padding-left:12px;padding-right:12px;gap:6px}.hlogo{height:24px}}
.lockbrand{text-align:center;margin-bottom:18px}.lockbrand img{height:54px;max-width:100%}
.lockbrand .sub{margin-top:6px;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.lock{background:radial-gradient(circle at 100% 0%,var(--acc2),transparent 45%),radial-gradient(circle at 0% 100%,var(--pri2),transparent 50%),var(--bg)}
.empty img{width:52px;height:52px;opacity:.35;display:block;margin:0 auto 8px}
.btn.pri{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ico{width:18px;height:18px;vertical-align:-3px}
.pillopt{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
@media print{
  body{background:#fff;color:#000}
  #app,header.top,.overlay,.toast{display:none!important}
  #print{display:block;font:12pt/1.4 Georgia,serif;color:#000}
  #print h1{font-size:18pt;margin:0 0 4px}
  #print .evo{border-left:2px solid #000;page-break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>

<script>
"use strict";

/* ===================== Base de datos local (IndexedDB) ===================== */
const DB = {
  db: null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('historias_clinicas', 2);
    r.onupgradeneeded = () => { const d = r.result;
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      if (!d.objectStoreNames.contains('patients')) d.createObjectStore('patients', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' }).createIndex('pend', 'pend'); };
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  tx(store, mode, fn){ return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const s = t.objectStore(store); let out; const q = fn(s); if (q) q.onsuccess = () => out = q.result; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  getMeta(k){ return this.tx('meta', 'readonly', s => s.get(k)); },
  setMeta(k, v){ return this.tx('meta', 'readwrite', s => s.put(v, k)); },
  delMeta(k){ return this.tx('meta', 'readwrite', s => s.delete(k)); },
  get(id){ return this.tx('patients', 'readonly', s => s.get(id)); },
  all(){ return this.tx('patients', 'readonly', s => s.getAll()); },
  put(rec){ return this.tx('patients', 'readwrite', s => s.put(rec)); },
  putMany(recs){ return this.tx('patients', 'readwrite', s => { recs.forEach(r => s.put(r)); }); },
  getFile(id){ return this.tx('files', 'readonly', s => s.get(id)); },
  putFile(rec){ return this.tx('files', 'readwrite', s => s.put(rec)); },
  pendingFiles(){ return this.tx('files', 'readonly', s => s.index('pend').getAllKeys()); },
};

/* ===================== Cifrado (AES-256-GCM + PBKDF2) ===================== */
let KEY = null;     // clave de datos (la del equipo): cifra pacientes, sesión, etc.
let UKEY = null;    // clave personal, derivada de la clave maestra: sólo protege la copia de la clave de datos
let DKRAW = null;   // bytes de la clave de datos (para invitar colegas)
const te = new TextEncoder(), td = new TextDecoder();
function b64(u8){ let s=''; for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s); }
function unb64(s){ const b = atob(s); const u = new Uint8Array(b.length); for (let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations: 310000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
// Contraseña de acceso al servidor: se DERIVA de la clave maestra; la clave maestra nunca viaja por internet.
async function deriveAuth(pass, email){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt: te.encode('hc-auth|' + email), iterations: 200000, hash:'SHA-256' }, base, 256);
  return b64(new Uint8Array(bits));
}
async function enc(obj, key = KEY){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, te.encode(JSON.stringify(obj))); return { iv: b64(iv), ct: b64(new Uint8Array(ct)) }; }
async function dec(box, key = KEY){ const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(box.iv) }, key, unb64(box.ct)); return JSON.parse(td.decode(pt)); }
const VERIF = 'historias-clinicas-ok';
const importDK = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
const wrapDK = (raw, k) => enc({ dk: b64(raw) }, k);
async function unwrapDK(box, k){ return unb64((await dec(box, k)).dk); }
async function setDataKey(raw){ DKRAW = raw; KEY = await importDK(raw); }
const newRawKey = () => crypto.getRandomValues(new Uint8Array(32));
const sameRaw = (a, b) => !!a && !!b && b64(a) === b64(b);
// Abre la clave de datos con la clave personal. Si los datos son de la versión anterior (sin clave de datos), los migra.
async function openDataKey(){
  const box = await DB.getMeta('dk');
  if (box){ await setDataKey(await unwrapDK(box, UKEY)); return; }
  const oldKey = UKEY, raw = newRawKey(); await setDataKey(raw);
  const out = [];
  for (const r of await DB.all()){ try { const p = await dec(r.box, oldKey); out.push({ id: r.id, box: await enc(p), rev: null, dirty: true, lv: (r.lv || 0) + 1 }); } catch(_){} }
  if (out.length) await DB.putMany(out);
  const ses = await DB.getMeta('session'); if (ses){ try { await DB.setMeta('session', await enc(await dec(ses, oldKey))); } catch(_){ await DB.delMeta('session'); } }
  await DB.setMeta('dk', await wrapDK(raw, UKEY)); await DB.setMeta('lastRev', 0); await DB.delMeta('equipo');
}
// Invitaciones: el código lleva el número de invitación y un secreto que nunca llega al servidor
const b64url = u8 => b64(u8).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64url = s => unb64(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
async function inviteKey(secret){ return crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', secret), 'AES-GCM', false, ['encrypt', 'decrypt']); }
function makeInviteCode(id, secret){ const u = new Uint8Array(16); id.replace(/-/g, '').match(/../g).forEach((h, i) => u[i] = parseInt(h, 16)); const all = new Uint8Array(34); all.set(u); all.set(secret, 16); return 'MANO-' + b64url(all); }
function parseInviteCode(code){
  const m = String(code || '').match(/MANO-([A-Za-z0-9_-]{40,})/) || String(code || '').match(/invitacion=([A-Za-z0-9_-]{40,})/); const c = m ? m[1] : String(code || '').trim();
  let u; try { u = unb64url(c); } catch(_){ throw new Error('El código de invitación no es válido.'); }
  if (u.length !== 34) throw new Error('El código de invitación no es válido.');
  const h = [...u.slice(0, 16)].map(x => x.toString(16).padStart(2, '0')).join('');
  return { id: `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`, secret: u.slice(16) };
}
async function checkPass(pass, saltB64, verifier){ try { const k = await deriveKey(pass, unb64(saltB64)); return (await dec(verifier, k)) === VERIF ? k : null; } catch(_){ return null; } }

const App = { evoPract: {}, patients: [], view: 'home', current: null, turnosDate: isoDate(new Date()), drafts: {}, lastActivity: Date.now(), needsRender: false };

const byId = id => App.patients.find(p => p.id === id);
function setMem(p){ const i = App.patients.findIndex(x => x.id === p.id); if (i >= 0) App.patients[i] = p; else App.patients.push(p); }

async function savePatient(p){
  p.actualizado = Date.now();
  const box = await enc(p);
  const old = await DB.get(p.id);
  await DB.put({ id: p.id, box, rev: old ? old.rev : null, dirty: true, lv: ((old && old.lv) || 0) + 1 });
  setMem(p);
  Sync.schedule();
}

const Sync = {
  cfg: null, sess: null, email: '', lastRev: 0, vaultAt: null, busy: false, again: false, timer: null,

  configured(){ return !!(this.cfg && this.cfg.url && this.cfg.anon); },

  defaultCfg(){ return SUPABASE_URL && SUPABASE_ANON_KEY ? { url: SUPABASE_URL.replace(/\/+$/, ''), anon: SUPABASE_ANON_KEY } : null; },
  async load(){
    this.cfg = (await DB.getMeta('syncCfg')) || this.defaultCfg();
    this.email = (await DB.getMeta('syncEmail')) || '';
    this.lastRev = (await DB.getMeta('lastRev')) || 0;
    this.vaultAt = (await DB.getMeta('vaultAt')) || null;
    this.eq = (await DB.getMeta('equipo')) || null;
    this.members = (await DB.getMeta('miembros')) || [];
    const s = await DB.getMeta('session');
    this.sess = null; this.paused = false;
    if (s && KEY) { try { this.sess = await dec(s); } catch(_){} }

  },
  reset(){ clearTimeout(this.timer); this.sess = null; this.status = 'off'; this.busy = false; },
  async saveSess(){ await DB.setMeta('session', await enc(this.sess)); },
  setSess(j){ const prev = this.sess && this.sess.user_id; this.sess = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user_id: (j.user && j.user.id) || prev }; },
  myId(){ return (this.sess && this.sess.user_id) || 'local'; },
  async auth(path, body, method = 'POST', token){
    const h = { apikey: this.cfg.anon, 'Content-Type': 'application/json' }; if (token) h.Authorization = 'Bearer ' + token;
    let r; try { r = await fetch(this.cfg.url + '/auth/v1/' + path, { method, headers: h, body: JSON.stringify(body) }); }
    catch(_){ throw new Error('No hay conexión con el servidor. Revisá internet y la dirección del servidor.'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok){ const m = j.error_description || j.msg || j.message || j.error || ('Error ' + r.status);
      if (/invalid login|invalid_grant|invalid credentials/i.test(m)) throw new Error('Email o clave incorrectos.');
      if (/already registered|already exists/i.test(m)) throw new Error('Ese email ya tiene cuenta. Elegí “Ya tengo cuenta”.');
      throw new Error(m); }
    return j;
  },
  async token(){
    if (Date.now() > this.sess.expires_at - 60000){
      try { const j = await this.auth('token?grant_type=refresh_token', { refresh_token: this.sess.refresh_token }); this.setSess(j); await this.saveSess(); }
      catch(e){ if (/conexi/.test(e.message)) throw e; this.paused = 'login'; throw new Error('La sesión del servidor venció. Volvé a conectar.'); }
    }
    return this.sess.access_token;
  },
  async rest(method, path, body, prefer){
    const h = { apikey: this.cfg.anon, Authorization: 'Bearer ' + await this.token(), 'Content-Type': 'application/json' };
    if (prefer) h.Prefer = prefer;
    let r; try { r = await fetch(this.cfg.url + '/rest/v1/' + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined }); }
    catch(_){ throw new Error('Sin conexión'); }
    if (r.status === 401){ this.sess.expires_at = 0; }
    const txt = await r.text(); let data = null; try { data = txt ? JSON.parse(txt) : null; } catch(_){}
    return { status: r.status, ok: r.ok, data };
  },
  /* Conectar este dispositivo a la cuenta (crear cuenta, ingresar o aceptar una invitación) */
  async connect(email, pass, mode, cfg, extra = {}){
    if (cfg) this.cfg = cfg;
    if (!this.configured()) throw new Error('Falta configurar la dirección y la clave pública del servidor.');
    email = email.trim().toLowerCase();
    const authPw = await deriveAuth(pass, email);
    let j;
    if (mode === 'signup' || mode === 'invite'){
      try { j = await this.auth('signup', { email, password: authPw }); }
      catch(e){ if (mode === 'invite' && /ya tiene cuenta/.test(e.message)) j = await this.auth('token?grant_type=password', { email, password: authPw }); else throw e; }
      if (!j.access_token) throw new Error('Cuenta creada, pero el servidor pide confirmar el email: abrí el enlace que te llegó por correo y después elegí “Ya tengo cuenta”.');
    } else j = await this.auth('token?grant_type=password', { email, password: authPw });
    this.setSess(j); this.paused = false;
    // 1) bóveda personal (protege la copia de la clave de datos)
    const v = await this.rest('GET', 'vault?select=salt,verifier,updated_at');
    if (!v.ok) throw new Error('El servidor respondió con error ' + v.status + '. ¿Se ejecutó el script supabase.sql?');
    let vault = v.data && v.data[0];
    const localSalt = await DB.getMeta('salt');
    if (vault){
      const k = await checkPass(pass, vault.salt, vault.verifier);
      if (!k) throw new Error('La clave maestra no coincide con la de la cuenta.');
      UKEY = k;
    } else {
      let salt = localSalt, verifier = await DB.getMeta('verifier');
      if (salt){ const k = await checkPass(pass, salt, verifier); if (!k) throw new Error('La clave no coincide con la clave maestra de este dispositivo.'); UKEY = k; }
      else { const sb = crypto.getRandomValues(new Uint8Array(16)); salt = b64(sb); UKEY = await deriveKey(pass, sb); verifier = await enc(VERIF, UKEY); }
      const r = await this.rest('POST', 'vault', { salt, verifier }, 'return=representation');
      if (!r.ok) throw new Error('No se pudo crear la cuenta cifrada en el servidor (error ' + r.status + ').');
      vault = r.data[0];
    }
    await DB.setMeta('salt', vault.salt); await DB.setMeta('verifier', vault.verifier);
    this.email = email; this.vaultAt = vault.updated_at;
    await DB.setMeta('syncCfg', this.cfg); await DB.setMeta('syncEmail', email); await DB.setMeta('vaultAt', vault.updated_at);
    if (extra.perfil) await DB.setMeta('perfil', extra.perfil);
    // 2) equipo
    this.eq = null; await DB.delMeta('equipo');
    await this.ensureTeam(extra.invite || null, extra.perfil || null, extra.migrarLegacy !== false);
    await this.saveSess();
    await this.sync();
  },
  // Re-cifra los datos locales si la clave de datos cambia (p. ej. al unirse a un equipo)
  async adoptDataKey(raw){
    if (!sameRaw(DKRAW, raw)){
      await setDataKey(raw);
      const recs = []; for (const p of App.patients){ const old = await DB.get(p.id); recs.push({ id: p.id, box: await enc(p), rev: null, dirty: true, lv: ((old && old.lv) || 0) + 1 }); }
      if (recs.length) await DB.putMany(recs);
      this.lastRev = 0; await DB.setMeta('lastRev', 0);
    }
    await DB.setMeta('dk', await wrapDK(raw, UKEY));
  },
  async ensureTeam(invite, perfil, migrar = true, intento = 0){
    const uid = this.sess.user_id;
    const perfilBox = async () => { const pf = perfil || await DB.getMeta('perfil'); return pf ? await enc(pf) : null; };
    if (invite){
      const { id, secret } = parseInviteCode(invite);
      const r = await this.rest('POST', 'rpc/ver_invitacion', { p_id: id });
      if (!r.ok) throw new Error('No se pudo leer la invitación (error ' + r.status + '). ¿Se ejecutó la última versión de supabase.sql?');
      if (!r.data || !r.data.length) throw new Error('La invitación no es válida, ya se usó o venció. Pedile una nueva a quien te invitó.');
      let raw; try { raw = await unwrapDK(r.data[0].clave, await inviteKey(secret)); } catch(_){ throw new Error('El código de invitación está incompleto o mal copiado.'); }
      await this.adoptDataKey(raw);
      const a = await this.rest('POST', 'rpc/aceptar_invitacion', { p_id: id, p_clave: await wrapDK(raw, UKEY), p_perfil: await perfilBox() });
      if (!a.ok) throw new Error((a.data && a.data.message) || 'No se pudo aceptar la invitación.');
      this.eq = { id: a.data, rol: 'medico' };
    } else {
      const m = await this.rest('GET', `miembros?select=equipo_id,rol,activo,clave&user_id=eq.${uid}`);
      if (!m.ok) throw new Error('El servidor respondió con error ' + m.status + '. Ejecutá la última versión de supabase.sql (agrega los equipos).');
      const mine = (m.data || []).find(x => x.activo);
      if (!mine && (m.data || []).length){ this.paused = 'baja'; throw new Error('Tu acceso al equipo fue dado de baja. Consultá con el administrador.'); }
      if (mine){
        let raw; try { raw = await unwrapDK(mine.clave, UKEY); } catch(_){ throw new Error('No se pudo abrir la clave del equipo con tu clave maestra.'); }
        await this.adoptDataKey(raw);
        this.eq = { id: mine.equipo_id, rol: mine.rol };
      } else {
        // Primera vez: se crea el equipo con los datos de este dispositivo
        const raw = DKRAW || newRawKey(); await this.adoptDataKey(raw);
        const e = await this.rest('POST', 'equipos', { nombre: MARCA.nombre }, 'return=representation');
        if (!e.ok){ if (e.status === 409 && intento < 2){ await new Promise(r => setTimeout(r, 1500)); return this.ensureTeam(null, perfil, migrar, intento + 1); } throw new Error('No se pudo crear el equipo (error ' + e.status + ').'); }
        const eqId = e.data[0].id;
        const r = await this.rest('POST', 'miembros', { equipo_id: eqId, rol: 'admin', clave: await wrapDK(raw, UKEY), perfil: await perfilBox() }, 'return=representation');
        if (!r.ok) throw new Error('No se pudo crear el equipo (error ' + r.status + ').');
        this.eq = { id: eqId, rol: 'admin' };
        if (migrar) await this.migrateLegacy();
        const all = await DB.all(); all.forEach(x => { x.dirty = true; x.rev = null; }); if (all.length) await DB.putMany(all);
        this.lastRev = 0; await DB.setMeta('lastRev', 0);
      }
    }
    await DB.setMeta('equipo', this.eq);
    await this.loadMembers();
  },
  // Pacientes guardados por la versión anterior (antes de los equipos)
  async migrateLegacy(){
    let from = 0;
    for (;;){
      const r = await this.rest('GET', `records?select=id,box&order=id.asc&offset=${from}&limit=500`);
      if (!r.ok || !r.data || !r.data.length) break;
      for (const row of r.data){
        let p; try { p = await dec(row.box, UKEY); } catch(_){ continue; }
        const cur = byId(p.id); const m = cur ? mergePatients(cur, p) : p;
        const old = await DB.get(m.id); await DB.put({ id: m.id, box: await enc(m), rev: null, dirty: true, lv: ((old && old.lv) || 0) + 1 }); setMem(m);
      }
      if (r.data.length < 500) break; from += 500;
    }
  },
  async loadMembers(){
    if (!this.eq) return;
    const r = await this.rest('GET', `miembros?select=user_id,rol,activo,perfil&equipo_id=eq.${this.eq.id}`);
    if (!r.ok) return;
    const out = [];
    for (const m of r.data){ let pf = null; try { pf = m.perfil ? await dec(m.perfil) : null; } catch(_){} out.push({ id: m.user_id, rol: m.rol, activo: m.activo, nombre: pf && pf.nombre || '', matricula: pf && pf.matricula || '' }); }
    this.members = out; await DB.setMeta('miembros', out);
    const me = out.find(x => x.id === this.sess.user_id);
    if (me && !me.activo){ this.paused = 'baja'; throw new Error('Tu acceso al equipo fue dado de baja. Consultá con el administrador.'); }
    if (me && this.eq.rol !== me.rol){ this.eq.rol = me.rol; await DB.setMeta('equipo', this.eq); }
  },
  async savePerfil(pf){
    await DB.setMeta('perfil', pf);
    if (!this.enabled() || !this.eq) return;
    const r = await this.rest('PATCH', `miembros?equipo_id=eq.${this.eq.id}&user_id=eq.${this.sess.user_id}`, { perfil: await enc(pf) }, 'return=representation');
    if (!r.ok) throw new Error('No se pudo guardar la firma en el servidor.');
    await this.loadMembers();
  },
  async disconnect(){ this.reset(); for (const k of ['session','syncEmail','vaultAt','lastRev','equipo','miembros']) await DB.delMeta(k); this.email = ''; this.eq = null; this.members = []; this.setStatus('off'); },
  schedule(ms = 1500){ if (!this.enabled()) { this.countPending(); return; } clearTimeout(this.timer); this.timer = setTimeout(() => this.sync(), ms); },
  async countPending(){ try { this.pending = (await DB.all()).filter(r => r.dirty).length + (await DB.pendingFiles()).length; } catch(_){} this.render(); },
  setStatus(s, d = ''){ this.status = s; this.detail = d; this.render(); },
  render(){
    const b = $('#syncBtn'); if (!b) return;
    const map = { off: ['✕', 'Sin sincronizar (sólo este dispositivo)'], ok: [ICON.check, 'Sincronizado'], syncing: ['⟳', 'Sincronizando…'], offline: [String(this.pending || '…'), 'Sin conexión: los cambios se guardan y se suben al volver internet'], error: ['⚠', 'Error de sincronización'], login: ['⚠', this.paused === 'baja' ? 'Acceso al equipo dado de baja' : 'Hay que volver a conectar'] };
    let st = this.paused ? 'login' : this.status;
    if (st === 'ok' && this.pending) st = 'offline';
    const [t, title] = map[st] || map.off;
    b.innerHTML = ICON.globe + '<span>' + t + '</span>'; b.title = title + (this.detail ? ': ' + this.detail : '');
    b.classList.toggle('warn', ['error','login','offline'].includes(st));
  },
  async sync(){
    if (!this.enabled() || !KEY){ this.countPending(); return; }
    if (this.busy){ this.again = true; return; }
    if (!navigator.onLine){ await this.countPending(); this.setStatus('offline'); return; }
    this.busy = true; this.again = false; this.setStatus('syncing');
    const keyAtStart = KEY;
    try {
      const v = await this.rest('GET', 'vault?select=updated_at');
      if (!v.ok) throw new Error('Error ' + v.status);
      if (v.data[0] && this.vaultAt && v.data[0].updated_at !== this.vaultAt){ this.paused = 'clave'; throw new Error('La clave maestra se cambió en otro dispositivo. Volvé a conectar con la clave nueva.'); }
      if (!this.eq){ if (!UKEY) throw new Error('Volvé a desbloquear la app.'); await this.ensureTeam(null, null, true); }
      this.changed = false;
      if (!this.lastRev) await this.pull(0); else { await this.reconcileIfDue(); await this.pull(this.lastRev); }
      if (!this.membersAt || Date.now() - this.membersAt > 5 * 60000){ this.membersAt = Date.now(); await this.loadMembers(); }
      const conflicts = await this.push();
      await this.uploadFiles();
      if (KEY !== keyAtStart) return;
      await this.countPending();
      this.lastOk = Date.now(); this.setStatus('ok');
      if (this.changed) refreshView();
      if (conflicts) this.again = true;
    } catch(e){
      await this.countPending();
      if (/permission denied|42501|row-level/i.test(e.message) || (/Error 40[13]/.test(e.message) && this.eq)){ this.paused = 'baja'; e = new Error('Tu acceso al equipo fue dado de baja o no tenés permiso.'); }
      this.setStatus(this.paused ? 'login' : (!navigator.onLine || /conexi/i.test(e.message) ? 'offline' : 'error'), e.message);
    } finally {
      this.busy = false;
      if (this.again && this.enabled()) this.schedule(800);
    }
  },
  async pull(after){
    let max = after;
    for (;;){
      const r = await this.rest('GET', `registros?select=id,box,rev&equipo_id=eq.${this.eq.id}&rev=gt.${max}&order=rev.asc&limit=200`);
      if (!r.ok) throw new Error('Error ' + r.status + ' al descargar');
      for (const row of r.data){ await this.applyRemote(row); if (row.rev > max) max = row.rev; }
      if (r.data.length < 200) break;
    }
    if (max > this.lastRev){ this.lastRev = max; await DB.setMeta('lastRev', max); }
  },
  // Cada tanto compara la lista completa (sólo id y versión, es liviana) para no perder nada.
  async reconcileIfDue(){
    if (this.lastReconcile && Date.now() - this.lastReconcile < 10 * 60000) return;
    const remote = []; let from = 0;
    for (;;){ const r = await this.rest('GET', `registros?select=id,rev&equipo_id=eq.${this.eq.id}&order=id.asc&offset=${from}&limit=1000`); if (!r.ok) return; remote.push(...r.data); if (r.data.length < 1000) break; from += 1000; }
    const local = new Map((await DB.all()).map(x => [x.id, x.rev]));
    const missing = remote.filter(x => local.get(x.id) !== x.rev).map(x => x.id);
    for (let i = 0; i < missing.length; i += 40){
      const ids = missing.slice(i, i + 40).map(id => '"' + id + '"').join(',');
      const r = await this.rest('GET', `registros?select=id,box,rev&equipo_id=eq.${this.eq.id}&id=in.(${encodeURIComponent(ids)})`);
      if (r.ok) for (const row of r.data) await this.applyRemote(row);
    }
    this.lastReconcile = Date.now();
  },
  async applyRemote(row){
    const local = await DB.get(row.id);
    if (local && local.rev === row.rev) return;
    let remote; try { remote = await dec(row.box); } catch(_){ return; }  // registro cifrado con otra clave: se ignora
    if (local && local.dirty){
      // Hubo cambios en los dos lados: se combinan (no se pierde ninguna evolución ni turno).
      const m = mergePatients(byId(row.id) || await dec(local.box), remote);
      await DB.put({ id: row.id, box: await enc(m), rev: row.rev, dirty: true, lv: (local.lv || 0) + 1 });
      setMem(m);
    } else {
      await DB.put({ id: row.id, box: row.box, rev: row.rev, dirty: false, lv: (local && local.lv) || 0 });
      setMem(remote);
    }
    this.changed = true;
  },
  async push(){
    let conflicts = 0;
    const recs = (await DB.all()).filter(r => r.dirty);
    for (const rec of recs){
      let res;
      if (rec.rev){
        res = await this.rest('PATCH', `registros?equipo_id=eq.${this.eq.id}&id=eq.${encodeURIComponent(rec.id)}&rev=eq.${rec.rev}`, { box: rec.box }, 'return=representation');
        if (res.ok && res.data && res.data.length){ await this.markClean(rec, res.data[0].rev); continue; }
        if (res.ok){ conflicts++; await this.refetch(rec.id); continue; }   // otro dispositivo lo modificó antes: combinar y reintentar
      } else {
        res = await this.rest('POST', 'registros', { equipo_id: this.eq.id, id: rec.id, box: rec.box }, 'return=representation');
        if (res.ok && res.data && res.data.length){ await this.markClean(rec, res.data[0].rev); continue; }
        if (res.status === 409){ conflicts++; await this.refetch(rec.id); continue; }
      }
      throw new Error('Error ' + res.status + ' al subir cambios');
    }
    return conflicts;
  },
  storagePath(id, n, dir){ return `adjuntos/${dir || this.sess.user_id}/${id}.${n}`; },
  async uploadFiles(){
    if (!this.sess.user_id) return;
    const ids = await DB.pendingFiles();
    for (const id of ids){
      const rec = await DB.getFile(id); if (!rec || !rec.pend) continue;
      for (let n = rec.done || 0; n < rec.chunks.length; n++){
        let r; try { r = await fetch(this.cfg.url + '/storage/v1/object/' + this.storagePath(id, n), { method: 'POST', headers: { apikey: this.cfg.anon, Authorization: 'Bearer ' + await this.token(), 'Content-Type': 'application/octet-stream', 'x-upsert': 'true' }, body: rec.chunks[n] }); }
        catch(_){ throw new Error('Sin conexión'); }
        if (!r.ok) throw new Error('Error ' + r.status + ' al subir un estudio' + (r.status === 400 || r.status === 404 ? ' (¿se ejecutó la última versión de supabase.sql?)' : ''));
        rec.done = n + 1; await DB.putFile(rec);
      }
      delete rec.pend; delete rec.done; await DB.putFile(rec);
    }
  },
  async downloadFile(a, onProgress){
    if (!navigator.onLine) throw new Error('Sin conexión: este estudio todavía no se descargó en este dispositivo.');
    const chunks = [];
    const dirs = [...new Set([a.dir, this.sess.user_id, ...this.members.map(m => m.id)].filter(Boolean))];
    let dir = null;
    for (let n = 0; n < a.nchunks; n++){
      onProgress && onProgress(Math.round(n / a.nchunks * 100));
      let r = null;
      for (const d of (dir ? [dir] : dirs)){
        try { r = await fetch(this.cfg.url + '/storage/v1/object/authenticated/' + this.storagePath(a.id, n, d), { headers: { apikey: this.cfg.anon, Authorization: 'Bearer ' + await this.token() } }); }
        catch(_){ throw new Error('Sin conexión'); }
        if (r.ok){ dir = d; break; }
      }
      if (!r || !r.ok) throw new Error(r && (r.status === 400 || r.status === 404) ? 'El estudio todavía no terminó de subirse desde el otro dispositivo.' : 'Error ' + (r && r.status) + ' al descargar el estudio');
      chunks.push(await r.arrayBuffer());
    }
    const rec = { id: a.id, chunks }; await DB.putFile(rec); return rec;
  },
  // Suma lo que ocupan en el servidor los estudios del equipo (carpeta de cada integrante)
  async storageUsage(){
    try { await this.loadMembers(); } catch(_){}     // incluir a quienes se sumaron hace poco
    const dirs = [...new Set([this.sess.user_id, ...this.members.map(m => m.id)].filter(Boolean))];
    let total = 0, n = 0;
    for (const d of dirs){
      for (let off = 0; ; off += 1000){
        let r; try { r = await fetch(this.cfg.url + '/storage/v1/object/list/adjuntos', { method: 'POST', headers: { apikey: this.cfg.anon, Authorization: 'Bearer ' + await this.token(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ prefix: d, limit: 1000, offset: off, sortBy: { column: 'name', order: 'asc' } }) }); } catch(_){ throw new Error('Sin conexión'); }
        if (!r.ok) throw new Error('Error ' + r.status);
        const items = await r.json();
        for (const it of items){ const sz = it.metadata && (it.metadata.size || it.metadata.contentLength); if (sz){ total += +sz; n++; } }
        if (items.length < 1000) break;
      }
    }
    return { total, n };
  },
  async refetch(id){ const r = await this.rest('GET', `registros?select=id,box,rev&equipo_id=eq.${this.eq.id}&id=eq.${encodeURIComponent(id)}`); if (r.ok && r.data[0]) await this.applyRemote(r.data[0]); },
  async markClean(rec, rev){ const cur = await DB.get(rec.id); if (!cur) return; cur.rev = rev; if (cur.lv === rec.lv) cur.dirty = false; await DB.put(cur); },
  /* Cambio de clave maestra con la cuenta conectada: sólo se re-cifra la copia de la clave de datos */
  async changePassword(oldPass, newPass){
    const r0 = await this.rest('GET', 'vault?select=updated_at'); if (!r0.ok) throw new Error('Necesitás conexión a internet para cambiar la clave.');
    const sb = crypto.getRandomValues(new Uint8Array(16)), nk = await deriveKey(newPass, sb), verifier = await enc(VERIF, nk), clave = await wrapDK(DKRAW, nk);
    await this.auth('user', { password: await deriveAuth(newPass, this.email) }, 'PUT', await this.token());
    if (this.eq){ const m = await this.rest('PATCH', `miembros?equipo_id=eq.${this.eq.id}&user_id=eq.${this.sess.user_id}`, { clave }, 'return=representation'); if (!m.ok || !m.data.length) throw new Error('No se pudo actualizar tu clave en el equipo.'); }
    const r = await this.rest('PATCH', `vault?user_id=eq.${this.sess.user_id}`, { salt: b64(sb), verifier }, 'return=representation');
    if (!r.ok || !r.data.length) throw new Error('No se pudo actualizar la clave en el servidor.');
    UKEY = nk; this.vaultAt = r.data[0].updated_at;
    await DB.setMeta('salt', b64(sb)); await DB.setMeta('verifier', verifier); await DB.setMeta('dk', clave); await DB.setMeta('vaultAt', this.vaultAt);
    await this.saveSess();
    await this.sync();
  }
};

function haystack(p){ return norm([p.apellido, p.nombre, p.nombre, p.apellido, p.dni, digits(p.dni), p.telefono, digits(p.telefono), p.obraSocial, p.nroAfiliado, p.idExterno, digits(p.telefono2)].join(' ')); }
function search(q){
  const toks = norm(q).replace(/[.,]/g,' ').split(/\s+/).filter(Boolean).map(t => /^\d+$/.test(t) ? t : t);
  if (!toks.length) return [];
  const res = [];
  for (const p of App.patients){
    const h = haystack(p); if (!toks.every(t => h.includes(t))) continue;
    const ap = norm(p.apellido), first = toks[0];
    const score = (ap.startsWith(first) ? 0 : norm(p.nombre).startsWith(first) ? 1 : 2);
    res.push([score, p]);
  }
  return res.sort((a,b) => a[0]-b[0] || fullName(a[1]).localeCompare(fullName(b[1]))).map(x => x[1]);
}

/* ===================== WhatsApp: pegar y analizar ===================== */
const OBRAS = ['IPS Salta','PAMI','OSDE','Swiss Medical','Galeno','Medifé','Sancor Salud','OSECAC','IOSFA','Omint','Accord Salud','Prevención Salud','Federada Salud','Jerárquicos Salud','OSPE','OSDEPYM','Unión Personal','Boreal','Particular'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
/* Palabras que nunca forman parte de un nombre */
const NO_NOMBRE = new Set(('hola buen buena buenas buenos dia dias tarde tardes noche noches doctor doctora dr dra doc dni documento tel cel celular telefono ' +
  'turno turnos el la los las lo un una unos unas con por para que y o a al del de en me mi mis su sus es soy son esta estoy tengo tiene necesito necesita ' +
  'quiero quisiera queria quería quisieramos puedo puede podria hay hoy manana mañana pasado lunes martes miercoles jueves viernes sabado domingo hs horas ' +
  'paciente nuevo nueva control consulta urgente gracias saludos atte favor obra social os prepaga anos años mama mamá papa papá hijo hija esposo esposa ' +
  'madre padre abuelo abuela nieto nieta hermano hermana marido señora senora señor senor sr sra le les te nos se ya si no muy bien mal dolor').split(' ').map(norm));
const WORD_RE = /^[\s]*([\p{L}'’-]+)/u;
function takeNameWords(str, max = 4){
  const words = []; let rest = str;
  while (words.length < max){ const m = rest.match(WORD_RE); if (!m) break; const w = m[1];
    if (NO_NOMBRE.has(norm(w)) || w.length < 2) break; words.push(w); rest = rest.slice(m[0].length); }
  return words;
}
function extractName(text){
  const t = ' ' + text.replace(/\s+/g, ' ') + ' ';
  // 1) un familiar escribe por el paciente: "soy la mamá de Tomás Vega", "turno para mi hijo juan perez"
  const REL = "(?:mam[aá]|pap[aá]|madre|padre|hij[oa]|espos[oa]|marido|abuel[oa]|niet[oa]|herman[oa]|tí[oa]|ti[oa]|sobrin[oa])";
  let re = new RegExp("\\b" + REL + "\\s+(?:de\\s+|,\\s*)?", "giu"), m;
  while ((m = re.exec(t))){ const w = takeNameWords(t.slice(m.index + m[0].length)); if (w.length >= 2) return w.join(' '); }
  // 2) después de palabras clave: "soy ...", "me llamo ...", "mi nombre es ...", "turno para ...", "paciente ..."
  re = /\b(?:soy|me llamo|mi nombre es|nombre|paciente|a nombre de|para)\s*:?\s+/giu;
  while ((m = re.exec(t))){ const w = takeNameWords(t.slice(m.index + m[0].length)); if (w.length >= 2 || (w.length === 1 && /soy|llamo|nombre/i.test(m[0]))) return w.join(' '); }
  // 3) un fragmento que es sólo un nombre en mayúscula: "Ana Belén Castro." / "JUAN PEREZ"
  for (const seg of text.split(/[,.;:!?()\n\d]+/)){
    const ws = seg.trim().split(/\s+/).filter(Boolean);
    if (ws.length >= 2 && ws.length <= 4 && ws.every(w => /^\p{Lu}/u.test(w) && !NO_NOMBRE.has(norm(w)))) return ws.join(' ');
  }
  // 4) firma al final: "Saludos, Laura"
  m = t.match(/\b(?:[Ss]aludos|[Gg]racias|[Aa]tte|[Aa]tentamente)\s*[,.!]?\s+(\p{Lu}[\p{L}'-]+(?:\s+\p{Lu}[\p{L}'-]+){0,2})[\s.!]*$/u);
  return m ? m[1] : '';
}
function extractMotivo(text){
  const m = text.match(/\b(me duele[n]?|me lesion\w*|me cort\w*|me golpe\w*|me quebr\w*|me fractur\w*|me torc\w*|dolor|control|curaci[oó]n|retiro|lesi[oó]n|fractura|esguince|herida|cirug[ií]a|operaci[oó]n|post ?operatorio|seguimiento|revisi[oó]n|yeso|tend[oó]n|dedo en gatillo|t[uú]nel carpiano|traumatismo|ca[ií]da)\b[^.?!\n]*/iu);
  if (!m) return '';
  const DIA = '(?:lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo|\\d|pr[oó]xim\\w*|d[ií]a)';
  let r = m[0].split(new RegExp('\\s+(?:(?:el|este|esta|para el|para la)\\s+' + DIA + '|a las\\b|mañana\\b|manana\\b|hoy\\b|(?:lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\\b|puedo\\b|puede\\b|tiene\\b|tendr[ií]a\\b|hay\\b|necesit\\w*|quer\\w*|quisier\\w*)', 'i'))[0];
  r = r.replace(/[\s,;:]+$/, '').slice(0, 90);
  return r.charAt(0).toUpperCase() + r.slice(1);
}
function parseWhatsApp(raw){
  const out = { apellido:'', nombre:'', dni:'', telefono:'', obraSocial:'', nroAfiliado:'', nacimiento:'', fecha:'', hora:'', motivo:'' };
  let sender = '', lines = [];
  // Quitar encabezados de mensajes exportados/copiados de WhatsApp: "[24/11/26, 10:15] Nombre: ..." o "24/11/26 10:15 - Nombre: ..."
  for (let ln of String(raw).split(/\r?\n/)){
    const m = ln.match(/^\s*\[?\d{1,2}\/\d{1,2}\/\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:[ap]\.?\s?m\.?)?\]?\s*-?\s*([^:]{1,40}):\s*(.*)$/i);
    if (m){ if (!sender && !/^\+?[\d\s-]+$/.test(m[1])) sender = m[1].trim(); else if (!out.telefono && /^\+?[\d\s-]{10,}$/.test(m[1])) out.telefono = m[1].trim(); ln = m[2]; }
    if (ln.trim()) lines.push(ln.trim());
  }
  let free = [];
  let fullname = '';
  for (const ln of lines){
    const m = ln.match(/^\s*[-•*]?\s*([A-Za-zÁÉÍÓÚáéíóúÑñ°º .\/]{2,30}?)\s*[:=]\s*(.+)$/);
    if (!m){ free.push(ln); continue; }
    const k = norm(m[1]).trim(), v = m[2].trim();
    if (/apellido/.test(k) && /nombre/.test(k)) fullname = v;
    else if (/^(paciente|nombre completo)$/.test(k)) fullname = v;
    else if (/apellido/.test(k)) out.apellido = v;
    else if (/nombre/.test(k)) out.nombre = v;
    else if (/dni|documento|d\.n\.i/.test(k)) out.dni = digits(v);
    else if (/tel|cel|whats|contacto|movil/.test(k)) out.telefono = v;
    else if (/obra|prepaga|cobertura|^os$|^o\.s/.test(k)) out.obraSocial = v;
    else if (/afiliado|credencial|carnet/.test(k)) out.nroAfiliado = v;
    else if (/nacimiento|nac|f\.? ?nac/.test(k)) { const d = parseFecha(v, true); if (d) out.nacimiento = d; }
    else if (/fecha|dia|turno/.test(k)) { const d = parseFecha(v); if (d) out.fecha = d; const h = parseHora(v); if (h) out.hora = h; }
    else if (/hora|horario/.test(k)) { const h = parseHora(v); if (h) out.hora = h; }
    else if (/motivo|consulta|diagnostico|por/.test(k)) out.motivo = v;
    else free.push(ln);
  }
  let rest = free.join('\n');
  // Teléfono: secuencias con 10 o más dígitos
  if (!out.telefono){ const m = rest.match(/(\+?\d[\d\s()-]{8,}\d)/g); if (m){ const ph = m.find(x => digits(x).length >= 10); if (ph){ out.telefono = ph.trim(); rest = rest.replace(ph, ' '); } } }
  else rest = rest.replace(out.telefono, ' ');
  // DNI

/* ===================== Estudios e imágenes (adjuntos) =====================
   Cada archivo se cifra con su propia clave (AES-256), que viaja dentro de la ficha cifrada del paciente.
   Se guarda en trozos de 8 MB, así se sincronizan estudios grandes sin problema. */
const CHUNK = 8 * 1024 * 1024;
const MAX_FILE = 400 * 1024 * 1024;
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
async function newFileKey(){ const k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt','decrypt']); return { k, raw: b64(new Uint8Array(await crypto.subtle.exportKey('raw', k))) }; }
const importFileKey = raw => crypto.subtle.importKey('raw', unb64(raw), 'AES-GCM', false, ['encrypt','decrypt']);
async function encFile(buf, key){
  const chunks = []; let o = 0;
  do { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, buf.slice(o, o + CHUNK)));
       const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); chunks.push(out.buffer); o += CHUNK; } while (o < buf.byteLength);
  return chunks;
}
async function decFile(chunks, key, mime){ const parts = []; for (const c of chunks){ const u = new Uint8Array(c); parts.push(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12))); } return new Blob(parts, { type: mime || 'application/octet-stream' }); }
async function getFileBlob(a, onProgress){
  let rec = await DB.getFile(a.id);
  if (!rec){
    if (!Sync.enabled()) throw new Error('Este archivo todavía no está en este dispositivo. Conectá la sincronización para descargarlo.');
    rec = await Sync.downloadFile(a, onProgress);
  }
  return decFile(rec.chunks, await importFileKey(a.k), a.mime);
}

const NO_DICOM_EXT = /\.(exe|dll|inf|ini|txt|htm|html|js|css|jar|xml|json|pdf|jpe?g|png|gif|bmp|ico|mp4|avi|bat|sh|cfg|log|msi|cab|chm|url|lnk|db|sys|ocx|zip)$/i;

// Extrae los archivos DICOM de un ZIP (ignora DICOMDIR, visores del CD, textos, etc.)
async function dicomsFromZip(buf, onProgress){
  const entries = (await readZip(buf)).filter(en => !NO_DICOM_EXT.test(en.name) && !/(^|\/)DICOMDIR$/i.test(en.name));
  const out = []; let i = 0;
  for (const en of entries){
    i++; if (onProgress && i % 10 === 0) onProgress(i, entries.length);
    let data; try { data = await en.read(); } catch(e){ if (/contraseña|navegador/.test(e.message)) throw e; continue; }
    if (isDicom(data)) out.push({ name: en.name.split('/').pop(), path: en.name, buf: data });
  }
  return out;
}

  for (const f of files){
    const name = te.encode(f.name), data = new Uint8Array(f.buf), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    parts.push(lh.buffer, name, data);
    const ch = new DataView(new ArrayBuffer(46)); ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(ch.buffer, name); offset += 30 + name.length + data.length;
  }
  const csize = central.reduce((s, x) => s + x.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22)); end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, csize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' }).arrayBuffer();
}

/* ---------- Agregar archivos ---------- */
function pickFiles(mode){
  const inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true;
  if (mode === 'foto'){ inp.accept = 'image/*'; inp.capture = 'environment'; inp.multiple = false; }
  else if (mode === 'dir'){ inp.webkitdirectory = true; }
  else inp.accept = 'image/*,application/pdf,.pdf,.dcm,.dicom,application/dicom,.zip,application/zip,*/*';
  inp.onchange = () => inp.files.length && addFiles([...inp.files], mode);
  inp.click();
}
async function compressImage(file){
  try {
    const bmp = await createImageBitmap(file); const max = 2400, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const thumb = await thumbFromCanvasLike(c, c.width, c.height);
    if (s === 1 && file.size < 3e6 && /jpe?g|png|webp/.test(file.type)) return { buf: await file.arrayBuffer(), mime: file.type, thumb };
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9)); return { buf: await blob.arrayBuffer(), mime: 'image/jpeg', thumb };
  } catch(_){ return { buf: await file.arrayBuffer(), mime: file.type, thumb: '' }; }
}
async function addFiles(files, mode){
  const p = byId(App.current); if (!p) return;
  p.adjuntos = p.adjuntos || [];
  const status = t => { const el = $('#adjStatus'); if (el) el.textContent = t; };
  const items = []; const dicoms = [];
  let i = 0;
  for (const f of files){
    i++; status(`Leyendo ${i} de ${files.length}…`);
    if (f.size > MAX_FILE){ toast(`${f.name} es demasiado grande (${fmtSize(f.size)}). Máximo ${fmtSize(MAX_FILE)}.`); continue; }
    const head = await f.slice(0, 132).arrayBuffer();
    if (isDicom(head) || /\.(dcm|dicom)$/i.test(f.name)){ const buf = await f.arrayBuffer(); if (/DICOMDIR$/i.test(f.name)) continue; dicoms.push({ name: f.name, buf }); continue; }
    if (mode === 'dir') continue;     // de una carpeta/CD sólo se toman las imágenes DICOM
    if (/^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name)){ const r = await compressImage(f); items.push({ nombre: f.name, tipo: 'img', ...r }); }
    else if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) items.push({ nombre: f.name, tipo: 'pdf', mime: 'application/pdf', buf: await f.arrayBuffer() });
    else if (/\.zip$/i.test(f.name) || /zip/.test(f.type)){
      const buf = await f.arrayBuffer(); let found = [];
      try { found = await dicomsFromZip(buf, (k, n) => status(`Abriendo ${f.name}: ${k} de ${n} archivos…`)); } catch(e){ toast(e.message); }
      if (found.length){ dicoms.push(...found); status(`${f.name}: ${found.length} imágenes DICOM`); }
      else items.push({ nombre: f.name, tipo: 'zip', mime: 'application/zip', buf });
    }
    else items.push({ nombre: f.name, tipo: 'otro', mime: f.type || 'application/octet-stream', buf: await f.arrayBuffer() });
  }
  // Agrupar por estudio (Study Instance UID): cada estudio queda como un solo adjunto
  const groups = new Map();
  for (const d of dicoms){ let meta = {}; try { meta = parseDicom(d.buf); } catch(_){}
    const key = meta.studyUID || [meta.paciente, meta.fecha, meta.estudio].join('|');
    if (!groups.has(key)) groups.set(key, []); groups.get(key).push({ ...d, meta }); }
  for (const g of groups.values()){
    g.sort((x, y) => (parseInt(x.meta.instancia) || 0) - (parseInt(y.meta.instancia) || 0) || x.name.localeCompare(y.name));
    const midI = Math.floor(g.length / 2), mid = g[midI];
    if (g.length === 1){ items.push({ nombre: mid.name, tipo: 'dicom', mime: 'application/dicom', buf: mid.buf, dicom: dcmSummary(mid.meta, 1), thumb: await dicomThumb(mid.buf, mid.meta) }); continue; }
    status(`Agrupando ${g.length} imágenes DICOM en un estudio…`);
    const zip = await makeZip(g.map((d, k) => ({ name: `IM${String(k + 1).padStart(4, '0')}.dcm`, buf: d.buf })));
    const s = dcmSummary(mid.meta, g.length);
    items.push({ nombre: `${s.modalidad || 'DICOM'} ${s.estudio || ''} (${g.length} imágenes).zip`.replace(/\s+/g, ' '), tipo: 'dicomzip', mime: 'application/zip', buf: zip, dicom: s, thumb: await dicomThumb(mid.buf, mid.meta) });
  }
  if (!items.length){ status(''); return toast(mode === 'dir' ? 'No se encontraron imágenes DICOM en esa carpeta.' : 'No se agregó ningún archivo.'); }
  const warn = [];
  for (const it of items){
    status(`Cifrando ${it.nombre}…`);
    const { k, raw } = await newFileKey(); const chunks = await encFile(it.buf, k); const id = uid();
    await DB.putFile({ id, chunks, pend: 1 });
    const fecha = it.dicom && it.dicom.fechaISO ? it.dicom.fechaISO : isoDate(new Date());
    p.adjuntos.push({ id, dir: (Sync.sess && Sync.sess.user_id) || null, nombre: it.nombre, desc: it.dicom ? [it.dicom.modalidad, it.dicom.estudio || it.dicom.serie].filter(Boolean).join(' · ') : '', tipo: it.tipo, mime: it.mime, size: it.buf.byteLength, nchunks: chunks.length, k: raw, fecha, agregado: Date.now(), thumb: it.thumb || '', dicom: it.dicom || null });
    if (it.dicom && it.dicom.paciente && !nameMatches(p, it.dicom.paciente)) warn.push(`${it.nombre}: el estudio dice “${it.dicom.paciente}”`);
  }
  await savePatient(p); status(''); renderPatient();
  toast(items.length === 1 ? 'Estudio agregado' : `${items.length} archivos agregados`, true);
  if (warn.length) setTimeout(() => alert('⚠️ Revisá que el estudio sea de este paciente:\n\n' + warn.join('\n')), 300);
}
function dcmSummary(m, n){ return { paciente: m.paciente || '', idPaciente: m.idPaciente || '', modalidad: m.modalidad || '', estudio: m.estudio || '', serie: m.serie || '', region: m.region || '', institucion: m.institucion || '', fechaISO: m.fechaISO || '', imagenes: n }; }
function nameMatches(p, dn){ const a = norm(dn).split(/\s+/); const ap = norm(p.apellido).split(/\s+/)[0]; return !ap || a.some(x => x === ap); }

    <label class="f" style="margin-top:12px"><span>Descripción</span><input class="i" id="adjDesc" value="${esc(a.desc || '')}" placeholder="Ej: Rx muñeca izquierda frente y perfil"></label>

      ${a.tipo === 'pdf' ? '<button class="btn pri" id="adjPdf">Abrir PDF</button>' : ''}

  $('#adjDel').onclick = async () => { if (!confirm('¿Quitar este archivo de la ficha?')) return; a.borrado = Date.now(); await savePatient(p); closeModal(); renderPatient(); };
  let blob = null;
  const view = $('#adjView');
  const load = async () => { if (blob) return blob; blob = await getFileBlob(a, pct => { if (view) view.innerHTML = `<div class="sub">Descargando ${pct}%…</div>`; }); return blob; };
  $('#adjDown').onclick = async () => { try { downloadBlob(await load(), safeFileName(a)); } catch(e){ toast(e.message); } };
  $('#adjShare').onclick = async () => { try { await shareFile(await load(), a); } catch(e){ toast(e.message); } };
  if ($('#adjPdf')) $('#adjPdf').onclick = async () => { const w = window.open('', '_blank'); try { const u = URL.createObjectURL(await load()); if (w) w.location = u; else location.href = u; } catch(e){ if (w) w.close(); toast(e.message); } };
  try {
    const b = await load(); if (!$('#adjView')) return;

      if (!$('#adjView')) return;
      if (!files.length){ if (a.tipo === 'zip') throw new Error('Este ZIP no contiene imágenes DICOM.'); throw new Error('No se encontraron imágenes.'); }
      $('#ov .modal').classList.add('wide');
      await mountViewer(view, files);
    }
    else if (a.thumb) view.innerHTML = `<img src="${a.thumb}" alt="" style="max-width:100%;display:block;margin:auto;border-radius:10px">${a.tipo === 'dicomzip' ? '<div class="sub" style="text-align:center;margin-top:6px">Vista previa de una imagen del estudio. Para ver todas las imágenes, abrilo en IDV.</div>' : ''}`;

  } catch(e){ if ($('#adjView')) view.innerHTML = `<div class="alert ${/IDV/.test(e.message) ? 'info' : 'warn'}">${esc(e.message)}</div>${a.thumb ? `<img src="${a.thumb}" alt="" style="max-width:100%;display:block;margin:auto;border-radius:10px">` : ''}`; }
}
// Nombre de archivo seguro (sin tildes ni símbolos) y con el apellido del paciente adelante
function safeFileName(a){ const p = byId(App.current); const base = ((p && p.apellido ? p.apellido + '_' : '') + (a.fecha ? a.fecha + '_' : '') + a.nombre);
  return base.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w.-]+/g, '_').replace(/_+/g, '_').replace(/_\./g, '.').slice(-120); }
function downloadBlob(blob, name){ const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000); }
/* Envía el archivo a otra app (en iPhone/iPad aparece la hoja “Compartir”, donde se elige IDV). */
async function shareFile(blob, a){
  let name = safeFileName(a); if (a.tipo === 'dicom' && !/\.(dcm|dicom)$/i.test(name)) name += '.dcm';
  for (const type of [a.mime, 'application/octet-stream']){
    const file = new File([blob], name, { type: type || 'application/octet-stream' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file] }); return; } catch(e){ if (e.name === 'AbortError') return; }
    }
  }
  downloadBlob(blob, name);
  toast('Se descargó el archivo: abrilo desde “Archivos” y elegí IDV.');
}

const domicilioDe = pf => (pf && pf.domicilio != null) ? pf.domicilio : CONSULTORIO;
const PARTICULAS = new Set(['de', 'del', 'la', 'las', 'los', 'y', 'van', 'von', 'da', 'do', 'dos']);
function nombrePropio(s){ return titleCase(String(s || '').trim().replace(/\s+/g, ' ')).split(' ').map((w, i) => i && PARTICULAS.has(w.toLowerCase()) ? w.toLowerCase() : w).join(' '); }
const telValido = t => { const d = digits(t); return d.length >= 7 && !/^0+$/.test(d) ? t.trim() : ''; };
function parseLista(raw){
  const text = String(raw || '').replace(/\r/g, '').replace(/[ \t]+/g, ' ');
  // fecha del listado: "martes 24 de noviembre de 2026" o "Desde 24/11/2026"
  let fecha = '';
  const fm = norm(text).match(/\b(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre) de (\d{4})/);
  if (fm) fecha = isoDate(new Date(+fm[3], fm[2] === 'setiembre' ? 8 : MESES.indexOf(fm[2]), +fm[1]));
  else { const d2 = text.match(/(?:desde|fecha)\s*:?\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/i); if (d2) fecha = isoDate(new Date(+d2[3], +d2[2] - 1, +d2[1])); }
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const out = [];
  const isRec = l => /\bDNI\s*:?\s*[\d.]{6,}/i.test(l) && (/ID\s*#/i.test(l) || /\bEdad\b/i.test(l) || /\bSexo\b/i.test(l));
  const starts = []; lines.forEach((l, i) => { if (isRec(l)) starts.push(i); });
  starts.forEach((i, k) => {
    // nombre: la línea anterior con coma (APELLIDO, NOMBRE); hora: la línea HH:MM más cercana arriba
    let nameIdx = -1;
    for (let j = i - 1; j >= Math.max(0, i - 3); j--){ if (/^(?:\d{1,2}[:.]\d{2}\s+)?[\p{L}'´`.\- ]+,\s*[\p{L}'´`.\- ]+$/u.test(lines[j])){ nameIdx = j; break; } }
    let nameLine = nameIdx >= 0 ? lines[nameIdx] : '', hora = '';
    const inl = lines[i].match(/^(.*?,.*?)\s+ID\s*#/i); if (!nameLine && inl) nameLine = inl[1];
    const hm = nameLine.match(/^(\d{1,2})[:.](\d{2})\s+(.*)$/); if (hm){ hora = `${pad(+hm[1])}:${hm[2]}`; nameLine = hm[3]; }
    for (let j = (nameIdx >= 0 ? nameIdx : i) - 1; !hora && j >= Math.max(0, (nameIdx >= 0 ? nameIdx : i) - 3); j--){ const t = lines[j].match(/^(\d{1,2})[:.](\d{2})(?:\s*hs?)?$/i); if (t) hora = `${pad(+t[1])}:${t[2]}`; }
    const end = k + 1 < starts.length ? starts[k + 1] - 2 : lines.length - 1;
    const chunk = lines.slice(i, Math.max(i + 1, end + 1));
    const all = chunk.join('\n');
    const g = re => { const m = all.match(re); return m ? m[1].trim() : ''; };
    const [ap, ...no] = nameLine.split(',');
    const r = { hora, apellido: nombrePropio(ap), nombre: nombrePropio(no.join(' ')),
      idExterno: g(/ID\s*#\s*:?\s*(\d+)/i), dni: digits(g(/DNI\s*:?\s*([\d.]+)/i)), edad: g(/Edad\s*:?\s*(\d+)/i),
      sexo: (g(/Sexo\s*:?\s*(Femenino|Masculino|F|M|X)\b/i) || '').charAt(0).toUpperCase(),
      obraSocial: g(/Cobertura\s*:?\s*(.+?)(?=\s+Plan\b|\s+Afiliado\b|$)/im), plan: g(/\bPlan\s*:?\s*(.+?)(?=\s+Afiliado\b|$)/im),
      nroAfiliado: g(/Afiliado\s*:?\s*([^\s\n]+)/i).replace(/^[.0\-]+$/, ''),
      tel: telValido(g(/Tel[eé]fono\s*:?\s*(\+?[\d \-]+?)(?=[ \t]+[A-Za-zÁÉÍÓÚáéíóú]|[ \t]*$)/im)), cel: telValido(g(/Celular\s*:?\s*(\+?[\d \-]+)/i)),
      estado: /\bAusente\b/i.test(all) ? 'ausente' : /\bAtendid[oa]\b/i.test(all) ? 'atendido' : 'pendiente', nota: '' };
    // notas sueltas del turno (montos, autorizaciones, "transfer", etc.)
    r.nota = chunk.slice(1).filter(l => !/^(Cobertura|Tel[eé]fono|Celular|Atendid[oa]s?|En espera|Ausente|Ver turno|Sin atender|Pendiente|Turnos|Desde|Hasta|Filtrar)\b/i.test(l)
      && !/\|/.test(l) && !/^\d{1,2}:\d{2}$/.test(l) && !/^(?:\d{1,2}[:.]\d{2}\s+)?[\p{L}'´`.\- ]+,\s*[\p{L}'´`.\- ]+$/u.test(l)).join(' · ').slice(0, 140);
    if (r.apellido || r.dni) out.push(r);
  });
  return { fecha, items: out };
}
function matchExisting(r){
  return App.patients.find(p => r.dni && digits(p.dni) === r.dni) ||
         App.patients.find(p => !r.dni && norm(p.apellido) === norm(r.apellido) && norm(p.nombre) === norm(r.nombre)) || null;
}

/* ===================== Estado de turnos (En espera / Atendido) ===================== */
// Un turno pasa a "Atendido" solo cuando el paciente tiene una evolución ese día (o si se marca a mano).
const evolDelDia = (p, f) => (p.evoluciones || []).some(e => isoDate(new Date(e.fecha)) === f);
function estadoTurno(t, p){ if (t.manual) return t.estado === 'atendido' ? 'atendido' : 'espera'; return (t.estado === 'atendido' || evolDelDia(p, t.fecha)) ? 'atendido' : 'espera'; }
function estadoBtn(t, p){ const st = estadoTurno(t, p);
  return `<button class="pill estado ${st === 'atendido' ? 'ok' : 'warn'}" data-act="tog-estado" data-pid="${p.id}" data-tid="${t.id}" title="Tocar para cambiar">${st === 'atendido' ? '✓ Atendido' : '● En espera'}</button>`; }
function conteoTurnos(list){ if (!list.length) return ''; const at = list.filter(([t, p]) => estadoTurno(t, p) === 'atendido').length;
  return ` <span class="conteo"><span class="luz espera"></span>${list.length - at} en espera <span class="luz atendido"></span>${at} atendido${at === 1 ? '' : 's'}</span>`; }
async function togEstado(pid, tid){
  const p = byId(pid), t = p && (p.turnos || []).find(x => x.id === tid); if (!t) return;
  const st = estadoTurno(t, p); t.manual = true; t.estado = st === 'atendido' ? 'espera' : 'atendido';
  await savePatient(p);
  if (App.view === 'patient') renderPatient(); else if (App.view === 'turnos') renderTurnos(); else renderResults();
}
