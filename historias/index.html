/* ===================== Espacio usado ===================== */
const PLANES = { gratis: { nombre: 'Gratuito', db: 500e6, files: 1e9 }, pro: { nombre: 'Pro', db: 8e9, files: 100e9 } };
const fmtBytes = n => n >= 1e9 ? (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + ' GB' : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB';
async function planActual(){ return PLANES[(await DB.getMeta('plan')) || 'gratis'] || PLANES.gratis; }
async function calcularUso(remoto = true){
  let db = 0; for (const r of await DB.all()) db += JSON.stringify(r.box).length;   // lo que ocupa cada ficha cifrada
  const ests = []; let filesLocal = 0;
  for (const p of App.patients) for (const a of (p.adjuntos || [])){ const sz = (a.size || 0) + 28 * (a.nchunks || 1); filesLocal += sz; ests.push({ p, a, sz }); }
  let files = filesLocal, fuente = 'dispositivo';
  if (remoto && Sync.enabled() && Sync.eq && navigator.onLine){ try { files = (await Sync.storageUsage()).total; fuente = 'servidor'; } catch(_){} }
  db = Math.round(db * 1.15);    // margen por índices y estructura de la base de datos
  const u = { db, files, fuente, at: Date.now(), pacientes: App.patients.length, estudios: ests.length,
    top: ests.sort((x, y) => y.sz - x.sz).slice(0, 5).map(x => ({ pid: x.p.id, pac: fullName(x.p), nombre: x.a.desc || x.a.nombre, fecha: x.a.fecha, sz: x.sz, quitado: !!x.a.borrado })) };
  await DB.setMeta('uso', { db: u.db, files: u.files, at: u.at, fuente });
  return u;
}
function barraUso(titulo, usado, limite, detalle){
  const pct = Math.min(100, usado / limite * 100), cls = pct >= 85 ? 'rojo' : pct >= 60 ? 'naranja' : 'verde';
  return `<div class="uso"><div class="row"><b class="grow">${titulo}</b><span><b>${fmtBytes(usado)}</b> de ${fmtBytes(limite)} · <b>${pct < 1 && usado ? '<1' : Math.round(pct)}%</b></span></div>
    <div class="uso-barra"><div class="${cls}" style="width:${Math.max(pct, usado ? 1 : 0)}%"></div></div><div class="sub">${detalle}</div></div>`;
}
async function usoPanel(){
  openModal('📊 Espacio usado', '<div class="sub">Calculando…</div>');
  const u = await calcularUso(true), plan = await planActual(), key = (await DB.getMeta('plan')) || 'gratis';
  if (!$('#ov')) return;
  const maxPct = Math.max(u.db / plan.db, u.files / plan.files) * 100;
  $('#ov .modal').innerHTML = `<h3>📊 Espacio usado</h3>
    <label class="f" style="max-width:320px"><span>Plan de Supabase</span><select class="i" id="usoPlan">${Object.entries(PLANES).map(([k, p]) => `<option value="${k}" ${k === key ? 'selected' : ''}>${p.nombre} (${fmtBytes(p.db)} fichas · ${fmtBytes(p.files)} estudios)</option>`).join('')}</select></label>
    ${barraUso('📋 Fichas, evoluciones y turnos', u.db, plan.db, `${u.pacientes} pacientes · cálculo aproximado`)}
    ${barraUso('🩻 Estudios e imágenes', u.files, plan.files, `${u.estudios} estudios · ${u.fuente === 'servidor' ? 'medido en el servidor (tuyos y de tu equipo)' : 'calculado con lo que hay en este dispositivo'}`)}
    ${maxPct >= 60 ? `<div class="alert warn">Te estás acercando al límite. Opciones: ver las tomografías y resonancias completas en el PACS (🏥 Ver en PACS) y guardar en la ficha sólo una foto de la imagen clave, o pasar al plan Pro de Supabase.</div>` : `<div class="alert info">Tenés espacio de sobra. Lo que más ocupa son las tomografías y resonancias completas.</div>`}
    ${u.top.length ? `<h4 style="margin:14px 0 6px">Los estudios más pesados</h4><ul class="list">${u.top.map(t => `<li data-uso-pid="${t.pid}"><div class="grow"><div class="name">${esc(t.nombre)}${t.quitado ? ' <span class="pill warn">quitado</span>' : ''}</div><div class="sub">${esc(t.pac)} · ${fmtDate(t.fecha || '')}</div></div><b>${fmtBytes(t.sz)}</b></li>`).join('')}</ul>` : ''}
    <p class="sub">Para ver el dato exacto: Supabase → tu organización → <b>Usage</b>. Los estudios quitados de una ficha siguen ocupando espacio en el servidor.</p>
    <div class="actions"><button class="btn" data-act="close">Cerrar</button></div>`;
  $('#usoPlan').onchange = async e => { await DB.setMeta('plan', e.target.value); usoPanel(); if (App.view === 'home') renderHome(); };
  document.querySelectorAll('[data-uso-pid]').forEach(li => li.onclick = () => { closeModal(); go('patient', li.dataset.usoPid); });
}
// Recalcula el uso como mucho cada 6 horas (después de sincronizar), para el aviso de la pantalla de inicio
async function revisarUso(){
  const c = await DB.getMeta('uso'); if (c && Date.now() - c.at < 6 * 3600e3) return;
  try { await calcularUso(true); if (App.view === 'home' && !$('#ov')) renderHome(); } catch(_){}
}

/* ===================== Historia en PDF (imprimir / compartir) =====================
   En el iPad, una app instalada en la pantalla de inicio no puede imprimir directo:
   se genera un PDF y se usa el menú Compartir (Imprimir, Guardar en Archivos, WhatsApp, Mail…). */
const cargarPDFLib = () => Codecs.script('jspdf.umd.min.js', 'jspdf').catch(() => { throw Codecs.fail(); });
async function generarPDF(p, modo, desde, conAnt){
  const { jsPDF } = await cargarPDFLib();
  const dom = domicilioDe(await DB.getMeta('perfil'));
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, M = 18, CW = W - 2 * M; let y = M;
  // la tipografía estándar del PDF admite tildes y ñ; se reemplazan sólo símbolos especiales
  const T = s => String(s ?? '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/\t/g, '    ').replace(/[^\x00-\xff\n]/g, '');
  const lh = sz => sz * 0.3528 * 1.4;
  const ensure = h => { if (y + h > H - 20){ doc.addPage(); y = M; } };
  const write = (txt, o = {}) => { const { size = 10.5, style = 'normal', color = [30, 30, 30], align = 'left' } = o;
    doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color);
    for (const par of T(txt).split('\n')){ const lines = par ? doc.splitTextToSize(par, CW) : [''];
      for (const ln of lines){ ensure(lh(size)); doc.text(ln, align === 'right' ? W - M : M, y, { align, baseline: 'top' }); y += lh(size); } } };
  // encabezado
  const logoH = 11; doc.addImage(LOGOS.logoGris, 'PNG', M, y, logoH * 1048 / 229, logoH);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(90, 90, 90); doc.text('Historia clínica', W - M, y + 1.5, { align: 'right', baseline: 'top' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.text('Emitida el ' + fmtDT(Date.now()), W - M, y + 7, { align: 'right', baseline: 'top' });
  if (dom) doc.text(T('Consultorio: ' + dom), W - M, y + 11, { align: 'right', baseline: 'top' });
  y += logoH + 4; doc.setDrawColor(190, 190, 190); doc.setLineWidth(0.3); doc.line(M, y, W - M, y); y += 5;
  // paciente
  write(fullName(p), { size: 16, style: 'bold', color: [20, 20, 20] }); y += 0.5;
  const sx = ({ F: 'Femenino', M: 'Masculino' })[p.sexo] || '';
  write([p.dni ? 'DNI ' + fmtDNI(p.dni) : '', p.nacimiento ? 'Nac. ' + fmtDate(p.nacimiento) + ' (' + edad(p.nacimiento) + ')' : edadAprox(p), sx].filter(Boolean).join('  ·  '), { size: 10, color: [70, 70, 70] });
  write([p.obraSocial ? p.obraSocial + (p.nroAfiliado ? ' Nº ' + p.nroAfiliado : '') : '', p.telefono ? 'Tel. ' + p.telefono : ''].filter(Boolean).join('  ·  '), { size: 10, color: [70, 70, 70] });
  y += 2;
  if (p.alergias) write('ALERGIAS: ' + p.alergias, { style: 'bold', color: [180, 35, 24] });
  if (conAnt && p.antecedentes){ y += 2; write('Antecedentes', { style: 'bold', size: 11 }); write(p.antecedentes); }
  if (conAnt && p.medicacion){ y += 2; write('Medicación habitual', { style: 'bold', size: 11 }); write(p.medicacion); }
  // evoluciones (orden cronológico)
  let evs = [...(p.evoluciones || [])].sort((a, b) => a.fecha - b.fecha);
  if (modo === 'ultima') evs = evs.slice(-1);
  else if (modo === 'desde' && desde) evs = evs.filter(e => isoDate(new Date(e.fecha)) >= desde);
  y += 4; ensure(14); doc.setDrawColor(218, 93, 48); doc.setLineWidth(0.7); doc.line(M, y, M + 22, y); doc.setLineWidth(0.3); y += 2.5;
  write(modo === 'ultima' ? 'Evolución' : 'Evoluciones' + (modo === 'desde' && desde ? ' desde el ' + fmtDate(desde) : ''), { size: 12, style: 'bold', color: [105, 73, 151] }); y += 1;
  if (!evs.length) write('Sin evoluciones en el período elegido.', { color: [120, 120, 120] });
  for (const e of evs){
    ensure(lh(10.5) * 3 + 6);
    write(fmtDT(e.fecha) + (e.editado ? '   (corregida el ' + fmtDT(e.editado) + ')' : ''), { size: 9.5, style: 'bold', color: [80, 80, 80] });
    write(e.texto);
    if ((e.practicas || []).length) write('Prácticas: ' + e.practicas.map(i => i.c + ' (C' + i.x + ') ' + nunCorto(i.d, 80)).join('; '), { size: 9, color: [90, 90, 90] });
    if (e.autor && e.autor.n) write(e.autor.n + (e.autor.m ? ' · ' + e.autor.m : ''), { size: 9.5, style: 'italic', color: [105, 73, 151], align: 'right' });
    y += 2; doc.setDrawColor(225, 225, 225); doc.line(M, y, W - M, y); y += 4;
  }
  // cirugías (sólo en la historia completa)
  const cirs = (p.cirugias || []).slice().sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
  if (modo === 'todo' && cirs.length){ y += 2; write('Cirugías', { size: 11, style: 'bold' });
    for (const c of cirs) write('•  ' + fmtDate(c.fecha) + (c.lado ? ' · ' + ladoTxt(c.lado) : '') + ' · ' + (c.practicas || []).map(i => i.c).join(' + ') + ' · ' + (c.dx || '') + ' · Cirujano: ' + (c.cirujano || ''), { size: 9.5, color: [60, 60, 60] }); }
  // estudios cargados (sólo en la historia completa)
  const ests = (p.adjuntos || []).filter(a => !a.borrado).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
  if (modo === 'todo' && ests.length){ y += 2; write('Estudios en la ficha', { size: 11, style: 'bold' });
    for (const a of ests) write('•  ' + fmtDate(a.fecha || '') + '   ' + (a.desc || a.nombre), { size: 9.5, color: [60, 60, 60] }); }
  // pie de página
  const n = doc.internal.getNumberOfPages();
  for (let i = 1; i <= n; i++){ doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(130, 130, 130);
    doc.setDrawColor(225, 225, 225); doc.line(M, H - 14, W - M, H - 14);
    doc.text(T(fullName(p) + (p.dni ? '  ·  DNI ' + fmtDNI(p.dni) : '')), M, H - 12, { baseline: 'top' });
    doc.text('Página ' + i + ' de ' + n, W - M, H - 12, { align: 'right', baseline: 'top' });
    doc.text(T(MARCA.nombre + (dom ? ' · ' + dom : '')), W / 2, H - 12, { align: 'center', baseline: 'top' }); }
  return { blob: doc.output('blob'), paginas: n, evoluciones: evs.length };
}
const pdfName = (pre, p) => (pre + '_' + p.apellido + '_' + p.nombre + '_' + isoDate(new Date())).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w-]+/g, '_') + '.pdf';
function mostrarPDFs(docs){
  const files = docs.map(d => new File([d.blob], d.name, { type: 'application/pdf' }));
  const canShare = f => !!(navigator.canShare && navigator.canShare({ files: f }));
  const todos = docs.length > 1 && canShare(files);
  $('#pdfRes').innerHTML = `<div class="alert info">✅ ${docs.length > 1 ? docs.length + ' documentos listos, para presentar por separado.' : 'PDF listo.'}
    ${canShare([files[0]]) ? ' Con <b>Compartir / Imprimir</b> elegís <b>Imprimir</b>, <b>Guardar en Archivos</b>, WhatsApp o Mail.' : ''}</div>
    ${docs.map((d, i) => `<div class="pdfdoc"><div class="name">📄 ${esc(d.label)}</div><div class="row" style="gap:8px;margin-top:6px">${canShare([files[i]]) ? `<button type="button" class="btn pri" data-sh="${i}">📤 Compartir / Imprimir</button>` : ''}<button type="button" class="btn ${canShare([files[i]]) ? '' : 'pri'}" data-op="${i}">🖨️ Abrir</button><button type="button" class="btn" data-dl="${i}">⬇️ Descargar</button></div></div>`).join('')}
    ${todos ? `<button type="button" class="btn" id="pdfShareAll" style="margin-top:8px">📤 Compartir ${docs.length === 2 ? 'los dos' : 'los ' + docs.length} juntos</button>` : ''}`;
  const share = async f => { try { await navigator.share({ files: f }); } catch(e){ if (e.name !== 'AbortError') toast('No se pudo compartir: probá con Descargar'); } };
  document.querySelectorAll('#pdfRes [data-sh]').forEach(b => b.onclick = () => share([files[+b.dataset.sh]]));
  document.querySelectorAll('#pdfRes [data-op]').forEach(b => b.onclick = () => { const u = URL.createObjectURL(docs[+b.dataset.op].blob); const w = window.open(u, '_blank'); if (!w) location.href = u; });
  document.querySelectorAll('#pdfRes [data-dl]').forEach(b => b.onclick = () => downloadBlob(docs[+b.dataset.dl].blob, docs[+b.dataset.dl].name));
  if ($('#pdfShareAll')) $('#pdfShareAll').onclick = () => share(files);
}
function mostrarPDF(blob, name, detalle){
  const file = new File([blob], name, { type: 'application/pdf' });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  $('#pdfRes').innerHTML = `<div class="alert info">✅ PDF listo${detalle ? ': ' + detalle : ''}.
    ${canShare ? 'Tocá <b>Compartir / Imprimir</b> y elegí <b>Imprimir</b>, <b>Guardar en Archivos</b>, WhatsApp o Mail.' : ''}</div>
    <div class="row" style="gap:8px">${canShare ? '<button type="button" class="btn pri" id="pdfShare">📤 Compartir / Imprimir</button>' : ''}<button type="button" class="btn ${canShare ? '' : 'pri'}" id="pdfOpen">🖨️ Abrir para imprimir</button><button type="button" class="btn" id="pdfDown">⬇️ Descargar</button></div>`;
  if ($('#pdfShare')) $('#pdfShare').onclick = async () => { try { await navigator.share({ files: [file], title: name }); } catch(e){ if (e.name !== 'AbortError') toast('No se pudo compartir: probá con Descargar'); } };
  $('#pdfOpen').onclick = () => { const u = URL.createObjectURL(blob); const w = window.open(u, '_blank'); if (!w) location.href = u; };
  $('#pdfDown').onclick = () => downloadBlob(blob, name);
}

/* ---------- Certificado médico ---------- */
const fechaLarga = iso => { const [y, m, d] = iso.split('-').map(Number); return `${d} de ${MESES[m - 1]} de ${y}`; };
const sumarDias = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return isoDate(new Date(y, m - 1, d + n)); };
// Arma el texto del certificado (también se muestra como vista previa)
function textoCertificado(p, c){
  const F = p.sexo === 'F', M = p.sexo === 'M';
  const trato = F ? 'la Sra.' : M ? 'el Sr.' : 'el/la paciente';
  const asistido = F ? 'asistida' : M ? 'asistido' : 'asistido/a';
  const nombre = [p.nombre, p.apellido].filter(Boolean).join(' ');
  const partes = [];
  let t = `Certifico que ${trato} ${nombre}${p.dni ? ', DNI ' + fmtDNI(p.dni) : ''}`;
  if (c.art) t += `, cobertura ${c.art}${c.siniestro ? ' (siniestro Nº ' + c.siniestro + ')' : ''}`;
  t += `, fue ${asistido} ${c.fecha === isoDate(new Date()) ? 'en el día de la fecha' : 'el día ' + fmtDate(c.fecha)} por ${c.dx || '__________'}.`;
  partes.push(t);
  if (c.tto) partes.push(`Se indica tratamiento: ${c.tto.replace(/\.$/, '')}.`);
  if (c.ind === 'reposo' && +c.dias > 0){ const desde = c.desde || c.fecha, hasta = sumarDias(desde, +c.dias - 1);
    partes.push(`Se indica reposo laboral por ${+c.dias} (${numLetras(+c.dias)}) día${+c.dias === 1 ? '' : 's'}, desde el ${fmtDate(desde)} hasta el ${fmtDate(hasta)} inclusive, con control posterior.`); }
  else if (c.ind === 'continuar') partes.push('Puede continuar con sus tareas habituales.');
  else if (c.ind === 'alta') partes.push(`Se otorga el alta laboral: puede reintegrarse a sus tareas habituales a partir del ${fmtDate(c.alta || c.fecha)}.`);
  partes.push(`Se extiende el presente a pedido ${F ? 'de la interesada' : M ? 'del interesado' : 'del/de la interesado/a'} para ser presentado ante quien corresponda.`);
  return partes;
}
function numLetras(n){ const u = ['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  if (n < 30) return u[n]; const d = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
  if (n < 100) return d[Math.floor(n / 10)] + (n % 10 ? ' y ' + u[n % 10] : ''); return String(n); }
async function generarCertificado(p, c, pf){
  const d = await docA5(pf, 'CERTIFICADO MÉDICO', `${c.lugar || 'Salta'}, ${fechaLarga(c.emision || isoDate(new Date()))}`);
  d.y += 2;
  for (const par of textoCertificado(p, c)) d.texto(par, { sz: 10.6, lh: 1.55, justify: true, after: 3.5 });
  return d.firma(d.BOT - 34);
}

const KINE_TIPOS = ['fisiokinesioterapia', 'terapia ocupacional', 'fisiokinesioterapia y terapia ocupacional'];
const KINE_REG = [['mano', 'f'], ['muñeca', 'f'], ['dedos de la mano', 'm'], ['antebrazo', 'm'], ['codo', 'm'], ['hombro', 'm'], ['miembro superior', 'm']];
const KINE_BIL = { 'mano': 'ambas manos', 'muñeca': 'ambas muñecas', 'dedos de la mano': 'dedos de ambas manos', 'antebrazo': 'ambos antebrazos', 'codo': 'ambos codos', 'hombro': 'ambos hombros', 'miembro superior': 'ambos miembros superiores' };
function sectorTexto(reg, lado){ if (lado === 'bil' && KINE_BIL[reg]) return KINE_BIL[reg];
  if (reg === 'dedos de la mano') return lado === 'der' ? 'dedos de la mano derecha' : lado === 'izq' ? 'dedos de la mano izquierda' : reg;
  const fem = (KINE_REG.find(r => r[0] === reg) || [reg, 'f'])[1] === 'f';
  return reg + (lado === 'der' ? (fem ? ' derecha' : ' derecho') : lado === 'izq' ? (fem ? ' izquierda' : ' izquierdo') : ''); }
/* ---------- Documentos A5 con la hoja membretada (membrete violeta + pie con QR y contacto) ---------- */
const VIOLETA = [105, 73, 151], NARANJA = [218, 93, 48];
const pdfT = s => String(s ?? '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[^\x00-\xff\n]/g, '');
function membrete(doc, pf){
  const W = 148, H = 210, T = pdfT;
  // banda superior
  doc.setFillColor(...VIOLETA); doc.rect(0, 0, W, 36, 'F');
  doc.setFillColor(255, 255, 255); doc.roundedRect(0, 31, W, 30, 7, 7, 'F');
  doc.addImage(MEMBRETE.logoBlanco, 'PNG', 9, 9.5, 11.5 * 438 / 96, 11.5);
  const x = 66, w = W - x - 7; let y = 5.8;
  doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.text(T(pf.nombre || ''), x, y, { baseline: 'top' }); y += 5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.8);
  if (pf.matricula){ doc.text(T(pf.matricula), x, y, { baseline: 'top' }); y += 3.6; }
  if (pf.especialidad){ const ls = doc.splitTextToSize(T(pf.especialidad), w); doc.text(ls, x, y, { baseline: 'top', lineHeightFactor: 1.2 }); y += ls.length * 3.4 + 0.3; }
  if (pf.asociacion){ doc.setFontSize(6.4); doc.setTextColor(232, 224, 245); const ls = doc.splitTextToSize(T(pf.asociacion), w).slice(0, 3); doc.text(ls, x, y, { baseline: 'top', lineHeightFactor: 1.2 }); }

  const yp = H - 26;
  doc.setDrawColor(...VIOLETA); doc.setLineWidth(0.4); doc.line(9, yp - 2.5, W - 9, yp - 2.5);
  doc.addImage(MEMBRETE.qr, 'PNG', 9, yp, 19, 19);

  item(MEMBRETE.icPin, pf.domicilio, 32, yp + 3); item(MEMBRETE.icWa, pf.telefono, 32, yp + 11.5);
  item(MEMBRETE.icMail, pf.email, 82, yp + 3); item(MEMBRETE.icWeb, pf.web, 82, yp + 11.5);
  doc.setFillColor(...NARANJA); doc.triangle(W - 15, H, W, H, W, H - 10, 'F');
}
async function docA5(pf0, titulo, lugarFecha){
  const { jsPDF } = await cargarPDFLib();
  const doc = new jsPDF({ unit: 'mm', format: 'a5' });
  const pf = perfilDoc(pf0), W = 148, H = 210, M = 14, CW = W - 2 * M, TOP = 40, BOT = H - 31, T = pdfT;
  const d = { doc, pf, W, H, M, CW, T, TOP, BOT, y: TOP };
  membrete(doc, pf);
  d.nuevaPag = () => { doc.addPage('a5'); membrete(doc, pf); d.y = TOP; };
  d.salto = h => { if (d.y + h > BOT) d.nuevaPag(); };
  d.titulo = t => { d.salto(10); doc.setFont('helvetica', 'bold'); doc.setFontSize(8.8); doc.setTextColor(...VIOLETA); doc.text(T(t), M, d.y, { baseline: 'top' }); d.y += 4.4; };
  // texto que corta de página sola; justify = justificado (salvo la última línea de cada párrafo)
  d.texto = (t, o = {}) => { const sz = o.sz || 10, x = o.x ?? M, w = o.w ?? CW, lh = sz * 0.3528 * (o.lh || 1.4);
    doc.setFont('helvetica', o.bold ? 'bold' : 'normal'); doc.setFontSize(sz); doc.setTextColor(...(o.color || [25, 25, 25]));
    const ls = doc.splitTextToSize(T(t), w);
    ls.forEach((l, i) => { d.salto(lh); doc.setFont('helvetica', o.bold ? 'bold' : 'normal'); doc.setFontSize(sz); doc.setTextColor(...(o.color || [25, 25, 25]));
      if (o.justify && i < ls.length - 1) doc.text(l, x, d.y, { baseline: 'top', align: 'justify', maxWidth: w }); else doc.text(l, x, d.y, { baseline: 'top' }); d.y += lh; });
    d.y += o.after ?? 2.2; };

    doc.setDrawColor(200, 190, 220); doc.setLineWidth(0.3); doc.roundedRect(M, d.y, CW, bh, 2, 2); let yy = d.y + 2.4;
    for (const [a, v] of filas){ doc.setFont('helvetica', 'bold'); doc.setFontSize(8.6); doc.setTextColor(95, 95, 95); doc.text(a + ':', M + 4, yy, { baseline: 'top' });
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.4); doc.setTextColor(25, 25, 25); doc.text(doc.splitTextToSize(T(v), CW - 34)[0] || '', M + 30, yy, { baseline: 'top' }); yy += rh; }
    d.y += bh + 5; };

    const cx = W - M - 30;
    doc.setDrawColor(60, 60, 60); doc.setLineWidth(0.3); doc.line(cx - 28, y, cx + 28, y); y += 2.8;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.6); doc.setTextColor(25, 25, 25); doc.text(T(pf.nombre || ''), cx, y, { align: 'center', baseline: 'top' }); y += 4.6;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.2); doc.setTextColor(60, 60, 60);
    if (pf.matricula){ doc.text(T(pf.matricula), cx, y, { align: 'center', baseline: 'top' }); y += 3.8; }
    if (pf.especialidad){ doc.setFontSize(7.6); const ls = doc.splitTextToSize(T(pf.especialidad), 64); doc.text(ls, cx, y, { align: 'center', baseline: 'top' }); y += ls.length * 3.4; }
    if (pf.domicilio){ doc.setFontSize(7.6); doc.text(T(pf.domicilio), cx, y, { align: 'center', baseline: 'top' }); y += 3.4; }
    doc.setFontSize(6.8); doc.setTextColor(150, 150, 150); doc.text('Firma y sello', cx, y + 1.4, { align: 'center', baseline: 'top' });

  return d;
}

const NUN_REG = { MS: 'Miembro superior', CO: 'Columna vertebral', PC: 'Pelvis y cadera', RO: 'Rodilla', PP: 'Pierna y pie' };
const nunCorto = (d, n = 70) => d.length > n ? d.slice(0, n - 1).replace(/[\s,.;:]+\S*$/, '') + '…' : d;
function nunBuscar(q, reg){
  const qn = norm(q).trim(), qc = qn.replace(/[\s.]/g, '');
  const toks = qn.split(/\s+/).filter(Boolean);
  const out = [];
  for (const i of NUN){
    if (reg && !i.c.startsWith(reg)) continue;
    const code = norm(i.c).replace(/\./g, '');
    if (!toks.length || (qc.length >= 2 && /^[a-z]{2}\d*$/.test(qc) && code.startsWith(qc)) || toks.every(t => norm(i.d).includes(t))) out.push(i);
  }
  return out;
}
/* Selector de prácticas NUN para usar dentro de formularios.
   el: contenedor · sel: lista de prácticas elegidas [{c,x,d}] · onChange(sel) · modo 'elegir' (agrega) o 'consulta' (copia el código) */
function nunWidget(el, sel = [], onChange = () => {}, modo = 'elegir'){
  let reg = 'MS';
  el.innerHTML = `<div class="nunw">
    ${modo === 'elegir' ? '<div class="nun-sel"></div>' : ''}
    <input class="i nun-q" type="search" placeholder="Buscar práctica o código: túnel carpiano, gatillo, MS.04…" autocomplete="off">
    <div class="chips nun-reg" style="margin:8px 0">${Object.entries(NUN_REG).map(([k, v]) => `<button type="button" class="chip ${k === reg ? 'on' : ''}" data-r="${k}">${v}</button>`).join('')}<button type="button" class="chip" data-r="">Todas</button></div>
    <div class="nun-res"></div></div>`;
  const q = el.querySelector('.nun-q'), res = el.querySelector('.nun-res'), selBox = el.querySelector('.nun-sel');
  const pintarSel = () => { if (!selBox) return;
    selBox.innerHTML = sel.length ? sel.map((i, k) => `<div class="nun-pick"><span class="nun-cod">${esc(i.c)}</span><span class="pill">C${i.x}</span><span class="grow">${esc(nunCorto(i.d, 90))}</span><button type="button" class="btn sm" data-del="${k}" title="Quitar">✕</button></div>`).join('') : '<div class="sub">Ninguna práctica elegida todavía.</div>';
    selBox.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { sel.splice(+b.dataset.del, 1); pintarSel(); pintarRes(); onChange(sel); }); };
  const pintarRes = () => {
    const r = nunBuscar(q.value, reg), lim = 40;
    res.innerHTML = r.length ? `<ul class="list nun-list">${r.slice(0, lim).map(i => { const ya = sel.some(x => x.c === i.c && x.d === i.d);
      return `<li data-c="${esc(i.c)}" data-k="${NUN.indexOf(i)}" class="${ya ? 'ya' : ''}"><div class="grow"><div><span class="nun-cod">${esc(i.c)}</span> <span class="pill">Complejidad ${i.x}</span>${ya ? ' <span class="pill ok">elegida</span>' : ''}</div><div class="nun-d">${esc(i.d)}</div>${i.n ? `<div class="sub">⚠️ ${esc(i.n)}</div>` : ''}</div>${modo === 'elegir' ? (ya ? '' : '<span class="nun-add">＋</span>') : '<span class="nun-add" title="Copiar código">📋</span>'}</li>`; }).join('')}</ul>
      ${r.length > lim ? `<div class="sub" style="text-align:center;margin-top:6px">Se muestran ${lim} de ${r.length}. Escribí algo más para afinar la búsqueda.</div>` : ''}`
      : '<div class="empty">No se encontraron prácticas.</div>';
    res.querySelectorAll('li[data-k]').forEach(li => li.onclick = async () => { const i = NUN[+li.dataset.k];
      if (modo === 'elegir'){ if (sel.some(x => x.c === i.c && x.d === i.d)) return; sel.push({ c: i.c, x: i.x, d: i.d }); pintarSel(); pintarRes(); onChange(sel); }
      else { try { await navigator.clipboard.writeText(i.c); toast('Código ' + i.c + ' copiado', true); } catch(_){ toast(i.c); } } }); };
  q.oninput = () => pintarRes();
  el.querySelector('.nun-reg').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; reg = b.dataset.r; el.querySelectorAll('.nun-reg .chip').forEach(c => c.classList.toggle('on', c === b)); pintarRes(); };
  pintarSel(); pintarRes();
  return { focus: () => q.focus() };
}
const practicasHTML = (ps, n = 80) => (ps || []).length ? `<div class="nun-chips">${ps.map(i => `<span class="nun-chip" title="${esc(i.d)}"><b>${esc(i.c)}</b> ${esc(nunCorto(i.d, n))}</span>`).join('')}</div>` : '';
function nunModal(){
  openModal('🔎 Nomenclador Único Nacional', `<p class="sub" style="margin-top:0">Ortopedia y Traumatología · 6ª edición (2022) · ${NUN.length} prácticas. Tocá una para copiar su código.</p><div id="nunBox"></div>
    <div class="actions"><button class="btn" data-act="close">Cerrar</button></div>`);
  $('#ov .modal').classList.add('wide');
  nunWidget($('#nunBox'), [], () => {}, 'consulta').focus();
}

  const pf = (await DB.getMeta('perfil')) || {}, hoy = isoDate(new Date());
  const ex = cid ? (p.cirugias || []).find(c => c.id === cid) : null;

  const ped = (p.pedidos || []).filter(x => x.tipoDoc === 'cirugia').slice(-1)[0] || {}, cert = (p.certificados || []).slice(-1)[0] || {};

        <label class="f"><span>Institución</span><input class="i" id="cLugar" value="${esc(c.lugar)}" placeholder="Ej: Hospital Privado"></label></div>
      <label class="f"><span>Lado</span><div class="chips" id="cLado">${LADOS.map(([v, t]) => `<button type="button" class="chip ${v === c.lado ? 'on' : ''}" data-v="${v}">${t}</button>`).join('')}</div></label>

      <div class="grid2"><label class="f"><span>Cirujano</span><input class="i" id="cCir" list="cEq" value="${esc(c.cirujano)}"></label>
        <label class="f"><span>Ayudante</span><input class="i" id="cAyu" list="cEq" value="${esc(c.ayudante)}" placeholder="Opcional"></label></div>
      <datalist id="cEq">${equipo.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <label class="f"><span>Anestesia</span><div class="chips" id="cAne">${ANESTESIAS.map(a => `<button type="button" class="chip ${a === c.anestesia ? 'on' : ''}" data-v="${a}">${a}</button>`).join('')}</div></label>
      <label class="f"><span>Implantes / materiales (opcional)</span><input class="i" id="cImp" value="${esc(c.implantes)}" placeholder="Ej: placa volar bloqueada 2,4 mm"></label>
      <label class="f"><span>Protocolo / notas (opcional)</span><div class="row" style="align-items:flex-start"><div class="grow"><textarea class="i" id="cProt" style="min-height:80px">${esc(c.protocolo)}</textarea><div class="interim" id="interim-cProt"></div></div><button type="button" class="mic" data-act="mic" data-target="cProt">${MIC_SVG}</button></div></label>
      ${!ex ? '<label class="row" style="margin:6px 0"><input type="checkbox" id="cEvo" checked style="width:20px;height:20px"> Agregar también como evolución (firmada)</label>' : ''}
    </fieldset>
    ${ex && ex.autor ? `<div class="sub">Registrada por ${esc(ex.autor.n || '')} el ${fmtDT(ex.creado || Date.now())}${ex.editado ? ' · modificada ' + fmtDT(ex.editado) : ''}</div>` : ''}

  nunWidget($('#cNun'), c.practicas, s2 => { c.practicas = s2; });

  chipSel('#cLado', 'lado'); chipSel('#cAne', 'anestesia');
  if (!puede) return;

    if (!c.cirujano) return toast('Indicá el cirujano.');

          c.implantes ? `Implantes: ${c.implantes}.` : '', c.protocolo].filter(Boolean).join('\n');
        p.evoluciones = p.evoluciones || []; p.evoluciones.push({ id: uid(), fecha: Date.now(), texto: txt, autor: firmaActual(pf), practicas: c.practicas });
      }
    }
    await savePatient(p); closeModal(); renderPatient(); toast('Cirugía guardada', true); };
}
async function estadisticaModal(f = {}){
  const hoy = new Date(), y = hoy.getFullYear(), m = hoy.getMonth();
  const per = f.per || 'anio', ini = { mes: isoDate(new Date(y, m, 1)), mesant: isoDate(new Date(y, m - 1, 1)), anio: `${y}-01-01`, todo: '0000' }[per] || f.desde || '0000';
  const fin = per === 'mesant' ? isoDate(new Date(y, m, 0)) : per === 'rango' ? (f.hasta || '9999') : '9999';
  const todas = []; for (const p of App.patients) for (const c of (p.cirugias || [])) todas.push({ p, c });
  const cirujanos = [...new Set(todas.map(x => x.c.cirujano).filter(Boolean))].sort();
  const lista = todas.filter(({ c }) => c.fecha >= (per === 'rango' ? (f.desde || '0000') : ini) && c.fecha <= fin && (!f.cir || c.cirujano === f.cir)).sort((a, b) => b.c.fecha.localeCompare(a.c.fecha));
  const porCx = Array(11).fill(0), porCod = {};
  for (const { c } of lista){ const mx = Math.max(0, ...(c.practicas || []).map(i => i.x)); porCx[mx]++; for (const i of (c.practicas || [])){ const k = i.c + '|' + i.d; porCod[k] = (porCod[k] || 0) + 1; } }
  const top = Object.entries(porCod).sort((a, b) => b[1] - a[1]).slice(0, 10), maxCx = Math.max(1, ...porCx);
  openModal('📈 Cirugías y estadística', `
    <div class="chips" id="eqPer">${[['mes', 'Este mes'], ['mesant', 'Mes anterior'], ['anio', 'Este año'], ['todo', 'Todo'], ['rango', 'Elegir fechas']].map(([k, t]) => `<button type="button" class="chip ${k === per ? 'on' : ''}" data-p="${k}">${t}</button>`).join('')}</div>
    ${per === 'rango' ? `<div class="row" style="margin-top:8px"><input class="i" type="date" id="eqD" value="${f.desde || ''}" style="width:auto"> a <input class="i" type="date" id="eqH" value="${f.hasta || ''}" style="width:auto"></div>` : ''}
    <label class="f" style="margin-top:10px;max-width:340px"><span>Cirujano</span><select class="i" id="eqCir"><option value="">Todos</option>${cirujanos.map(n => `<option ${n === f.cir ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
    <div class="stat-big"><b>${lista.length}</b> cirugía${lista.length === 1 ? '' : 's'}</div>
    ${lista.length ? `<h4 style="margin:10px 0 6px">Por complejidad (la mayor de cada cirugía)</h4>
      <div class="cxbars">${porCx.map((n, k) => k && n ? `<div class="row"><span style="width:110px">Complejidad ${k}</span><div class="uso-barra grow" style="margin:0"><div class="verde" style="width:${n / maxCx * 100}%"></div></div><b style="width:32px;text-align:right">${n}</b></div>` : '').join('')}</div>
      <h4 style="margin:14px 0 6px">Prácticas más frecuentes</h4><ul class="list">${top.map(([k, n]) => { const [cod, d] = k.split('|'); return `<li style="cursor:default"><div class="grow"><span class="nun-cod">${esc(cod)}</span> <span class="sub">${esc(nunCorto(d, 90))}</span></div><b>${n}</b></li>`; }).join('')}</ul>
      <h4 style="margin:14px 0 6px">Detalle</h4><ul class="list">${lista.map(({ p, c }) => `<li data-pid2="${p.id}"><div class="grow"><div class="name">${fmtDate(c.fecha)} · ${esc(fullName(p))}</div><div class="sub">${(c.practicas || []).map(i => esc(i.c)).join(', ')} · ${esc(c.dx || '')} · ${esc(c.cirujano || '')}</div></div></li>`).join('')}</ul>`
    : '<div class="empty">No hay cirugías registradas en ese período.</div>'}
    <div class="actions">${lista.length ? '<button class="btn" id="eqCsv">⬇️ Descargar planilla (CSV)</button>' : ''}<button class="btn" data-act="close">Cerrar</button></div>`);
  $('#ov .modal').classList.add('wide');
  const re = () => estadisticaModal({ per: $('#eqPer .chip.on').dataset.p, cir: $('#eqCir').value, desde: $('#eqD') && $('#eqD').value, hasta: $('#eqH') && $('#eqH').value });
  $('#eqPer').onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return; $('#eqPer').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); re(); };
  $('#eqCir').onchange = re; if ($('#eqD')){ $('#eqD').onchange = re; $('#eqH').onchange = re; }
  document.querySelectorAll('[data-pid2]').forEach(li => li.onclick = () => { closeModal(); go('patient', li.dataset.pid2); });
  if ($('#eqCsv')) $('#eqCsv').onclick = () => {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const rows = [['Fecha', 'Paciente', 'DNI', 'Obra social', 'Nº afiliado', 'Lado', 'Diagnóstico', 'Códigos NUN', 'Complejidad máx.', 'Prácticas', 'Cirujano', 'Ayudante', 'Anestesia', 'Institución', 'Implantes']];
    for (const { p, c } of lista) rows.push([fmtDate(c.fecha), fullName(p), p.dni, p.obraSocial, p.nroAfiliado, ladoTxt(c.lado), c.dx, (c.practicas || []).map(i => i.c).join(' + '), Math.max(0, ...(c.practicas || []).map(i => i.x)), (c.practicas || []).map(i => i.d).join(' | '), c.cirujano, c.ayudante, c.anestesia, c.lugar, c.implantes]);
    downloadBlob(new Blob(['﻿' + rows.map(r => r.map(q).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' }), 'cirugias_' + isoDate(new Date()) + '.csv');
  };
}

/* ---------- Pedido de cirugía (solicitud de autorización) ---------- */
const docFilasCir = (p, k) => [['Paciente', fullName(p)], ['DNI', p.dni ? fmtDNI(p.dni) : ''], ['Edad', p.nacimiento ? edad(p.nacimiento) : edadAprox(p)],
  ['Cobertura', k.cobertura || p.obraSocial || ''], ['Nº de afiliado', p.nroAfiliado || ''], ['Nº de siniestro', k.siniestro || '']];
async function generarPedidoCirugia(p, k, pf){
  const d = await docA5(pf, 'SOLICITUD DE AUTORIZACIÓN QUIRÚRGICA', `${k.lugarFirma || 'Salta'}, ${fechaLarga(k.fecha)}`);
  d.caja(docFilasCir(p, k));
  d.titulo('Diagnóstico:'); d.texto(docDx(k), { after: 3 });
  d.titulo('Práctica solicitada (Nomenclador Único Nacional de Ortopedia y Traumatología):');
  for (const i of k.practicas){ d.salto(9); d.texto(`${i.c}  ·  Complejidad ${i.x}`, { sz: 9.8, bold: true, after: 0.6 }); d.texto(i.d, { sz: 9, x: d.M + 3, w: d.CW - 3, lh: 1.3, after: 2.4 }); }
  d.y += 1;
  if (k.materiales){ d.titulo('Materiales / implantes:'); d.texto('Según pedido de materiales adjunto.', { after: 3 }); }
  d.titulo('Anestesia y modalidad:'); d.texto(`${k.anestesia || ''}${k.anestesia ? ' · ' : ''}${k.modalidad === 'internacion' ? `Internación (${+k.dias || 1} día${+k.dias === 1 ? '' : 's'})` : 'Cirugía ambulatoria'}${k.institucion ? ' · ' + k.institucion : ''}.`, { after: 3 });
  if (k.fund){ d.titulo('Fundamentación:'); d.texto(docCap(k.fund)); }
  return d.firma();
}
async function generarPedidoMateriales(p, k, pf){
  const d = await docA5(pf, 'PEDIDO DE MATERIALES / IMPLANTES', `${k.lugarFirma || 'Salta'}, ${fechaLarga(k.fecha)}`);
  d.caja(docFilasCir(p, k));
  d.titulo('Diagnóstico:'); d.texto(docDx(k), { after: 3 });
  d.titulo('Para la cirugía (Nomenclador Único Nacional):');
  for (const i of k.practicas) d.texto(`${i.c} (complejidad ${i.x}): ${nunCorto(i.d, 150)}`, { sz: 9, lh: 1.3 });
  d.y += 2;
  d.titulo('Materiales / implantes solicitados:');
  for (const it of k.materiales.split(/\n+/).map(x => x.replace(/^[\s•\-*·]+/, '').trim()).filter(Boolean)){
    d.salto(6); d.doc.setFont('helvetica', 'bold'); d.doc.setFontSize(11); d.doc.setTextColor(...VIOLETA); d.doc.text('•', d.M + 1.5, d.y, { baseline: 'top' });
    d.texto(docCap(it), { sz: 10.5, x: d.M + 6, w: d.CW - 6, after: 1.6 }); }
  d.y += 2;
  if (k.institucion){ d.titulo('Institución:'); d.texto(k.institucion); }
  return d.firma();
}
// Estudios prequirúrgicos que salen automáticamente con cada pedido de cirugía
const PREQX = {
  ecg: { titulo: 'PEDIDO DE ESTUDIOS PREQUIRÚRGICOS', label: 'Electrocardiograma y valoración cardiológica', archivo: 'Pedido_ECG_valoracion',
         items: ['Electrocardiograma (ECG)', 'Valoración cardiológica prequirúrgica (riesgo quirúrgico)'] },
  lab: { titulo: 'PEDIDO DE LABORATORIO PREQUIRÚRGICO', label: 'Análisis de sangre prequirúrgico', archivo: 'Pedido_laboratorio',
         items: ['Hemograma completo', 'Coagulograma', 'Glucemia', 'Eritrosedimentación (VSG)', 'Proteína C reactiva (PCR)'] }
};
async function generarPedidoPrequirurgico(p, k, pf, tipo){
  const t = PREQX[tipo];
  const d = await docA5(pf, t.titulo, `${k.lugarFirma || 'Salta'}, ${fechaLarga(k.fecha)}`);
  d.caja(docFilasCir(p, k));
  d.titulo('Solicito:');
  for (const it of t.items){ d.salto(6); d.doc.setFont('helvetica', 'bold'); d.doc.setFontSize(11); d.doc.setTextColor(...VIOLETA); d.doc.text('•', d.M + 1.5, d.y, { baseline: 'top' });
    d.texto(it, { sz: 10.4, bold: true, x: d.M + 6, w: d.CW - 6, lh: 1.3, after: 0.8 }); }
  d.y += 2.5;
  d.titulo('Diagnóstico:'); d.texto(docDx(k), { after: 3 });
  d.titulo('Motivo:'); d.texto(`Evaluación prequirúrgica (cirugía programada: ${k.practicas.map(i => i.c).join(' + ')}).`, { sz: 9.6, lh: 1.35 });
  return d.firma();
}

    if (!k.dx) return toast('Escribí el diagnóstico.');
    if (!k.practicas.length) return toast('Elegí al menos una práctica del nomenclador.');
    const b = $('#qGo'); b.disabled = true; b.textContent = 'Generando…';
    try {

      if (k.materiales) docs.push({ blob: await generarPedidoMateriales(p, k, pf), name: pdfName('Pedido_materiales', p), label: 'Pedido de materiales / implantes' });
      k.preEcg = $('#qEcg').checked; k.preLab = $('#qLab').checked;
      for (const [on, tipo] of [[k.preEcg, 'ecg'], [k.preLab, 'lab']]) if (on) docs.push({ blob: await generarPedidoPrequirurgico(p, k, pf, tipo), name: pdfName(PREQX[tipo].archivo, p), label: PREQX[tipo].label });
      p.pedidos = p.pedidos || []; p.pedidos.push({ id: uid(), tipoDoc: 'cirugia', ...JSON.parse(JSON.stringify(k)), autor: firmaActual(pf), creado: Date.now() });
      await savePatient(p);

}

/* ===================== Dictado por voz ===================== */
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>';
const Dict = {
  rec: null, on: false, ta: null, btn: null,
  supported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  toggle(btn){ const ta = document.getElementById(btn.dataset.target); if (this.on && this.ta === ta) return this.stop(); this.stop(); this.start(ta, btn); },
  start(ta, btn){
    if (!this.supported()){ toast('Tu navegador no soporta dictado. Usá Chrome o Edge (o el micrófono del teclado del celular).'); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new SR(); r.lang = 'es-AR'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    this.rec = r; this.on = true; this.ta = ta; this.btn = btn; btn.classList.add('on');
    const interimEl = document.getElementById('interim-' + ta.id);
    r.onresult = ev => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++){
        const res = ev.results[i];
        if (res.isFinal) insertDictation(ta, res[0].transcript); else interim += res[0].transcript;
      }
      if (interimEl) interimEl.textContent = interim ? '… ' + interim : '';
      App.lastActivity = Date.now();
    };
    r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){ toast('Permití el uso del micrófono para dictar.'); this.stop(); } else if (e.error === 'network') { toast('El dictado necesita conexión a internet.'); this.stop(); } };
    r.onend = () => { if (this.on && this.rec === r){ try { r.start(); } catch(_){ this.stop(); } } };
    try { r.start(); } catch(_){ this.stop(); }
  },
  stop(){ if (this.rec){ const r = this.rec; this.rec = null; try { r.stop(); } catch(_){} }
    this.on = false; if (this.btn) this.btn.classList.remove('on');
    if (this.ta){ const el = document.getElementById('interim-' + this.ta.id); if (el) el.textContent = ''; this.ta.dispatchEvent(new Event('input')); }
    this.ta = null; this.btn = null; }
};
const COMANDOS = [
  [/\s*\bpunto y aparte\b\s*/gi, '.\n'], [/\s*\bnuevo p[aá]rrafo\b\s*/gi, '\n\n'], [/\s*\bnueva l[ií]nea\b\s*/gi, '\n'],
  [/\s*\bpunto y coma\b\s*/gi, '; '], [/\s*\bdos puntos\b\s*/gi, ': '], [/\s*\bpunto seguido\b\s*/gi, '. '], [/\s*\bpunto\b\s*/gi, '. '],
  [/\s*\bcoma\b\s*/gi, ', '], [/\s*\babrir par[eé]ntesis\b\s*/gi, ' ('], [/\s*\bcerrar par[eé]ntesis\b\s*/gi, ') '], [/\s*\bguion\b\s*/gi, ' - '],
  [/\s*\bsigno de interrogaci[oó]n\b\s*/gi, '? ']
];
function insertDictation(ta, text){
  let t = ' ' + text.trim() + ' ';
  for (const [re, rep] of COMANDOS) t = t.replace(re, rep);
  t = t.replace(/[ \t]+/g, ' ').replace(/ ([.,;:)?])/g, '$1').replace(/\n /g, '\n');
  const start = ta.selectionStart ?? ta.value.length, end = ta.selectionEnd ?? ta.value.length;
  const before = ta.value.slice(0, start), after = ta.value.slice(end);
  t = t.replace(/^\s+/, '');
  const capNext = !before.trim() || /[.?!]\s*$|\n\s*$/.test(before);
  if (capNext) t = t.charAt(0).toUpperCase() + t.slice(1);
  if (before && !/[\s(]$/.test(before) && !/^[.,;:)]/.test(t)) t = ' ' + t;
  t = t.replace(/([.?!]\s+|\n)(\p{Ll})/gu, (m, a, b) => a + b.toUpperCase()).replace(/\s+$/, ' ');
  ta.value = before + t + after;
  const pos = before.length + t.length; ta.setSelectionRange(pos, pos);
  ta.scrollTop = ta.scrollHeight;
  ta.dispatchEvent(new Event('input'));
}

/* ===================== Respaldo ===================== */
async function exportBackup(){
  const recs = await DB.all();
  const data = { app: 'historias-clinicas', version: 2, fecha: Date.now(), salt: await DB.getMeta('salt'), verifier: await DB.getMeta('verifier'), dk: await DB.getMeta('dk'), patients: recs.map(r => ({ id: r.id, box: r.box })) };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  const d = new Date(); a.download = `respaldo-hc-${isoDate(d)}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  await DB.setMeta('lastBackup', Date.now());
  toast('Respaldo cifrado descargado. Guardalo en un pendrive o en tu nube.');
  if (App.view === 'home') renderHome();
}
function importBackup(){
  const inp = $('#fileIn'); inp.value = '';
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    let data; try { data = JSON.parse(await file.text()); if (data.app !== 'historias-clinicas') throw 0; } catch(_){ return toast('Archivo de respaldo no válido'); }
    openModal('Restaurar respaldo', `<p>Respaldo del ${fmtDT(data.fecha)} con <b>${data.patients.length}</b> pacientes.</p>
      <p class="sub">Se combinará con los datos actuales: no se pierde ninguna evolución ni turno.</p>
      <label class="f"><span>Clave con la que se hizo ese respaldo</span><input class="i" type="password" id="impPw"></label><div id="impErr" class="alert danger hidden">Clave incorrecta.</div>
      <div class="actions"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" id="impOk">Restaurar</button></div>`);
    $('#impPw').focus();
    $('#impOk').onclick = async () => {
      $('#impOk').disabled = true;
      try {
        const pk = await deriveKey($('#impPw').value, unb64(data.salt));
        if (await dec(data.verifier, pk) !== VERIF) throw 0;
        const key = data.dk ? await importDK(await unwrapDK(data.dk, pk)) : pk;   // respaldos viejos: cifrados con la clave personal
        let n = 0;
        for (const r of data.patients){ let inc; try { inc = await dec(r.box, key); } catch(_){ continue; } const cur = byId(inc.id); await savePatient(cur ? mergePatients(cur, inc) : inc); n++; }
        closeModal(); toast(`${n} pacientes restaurados`); go('home');
      } catch(_){ $('#impErr').classList.remove('hidden'); $('#impOk').disabled = false; }
    };
  };
  inp.click();
}
function mergePatients(a, b){
  const newer = (b.actualizado||0) > (a.actualizado||0) ? b : a, older = newer === a ? b : a;
  const out = { ...older, ...newer };
  const union = k => { const m = new Map(); for (const x of (older[k]||[])) m.set(x.id, x); for (const x of (newer[k]||[])) m.set(x.id, x); return [...m.values()]; };
  out.evoluciones = union('evoluciones').sort((x,y) => x.fecha - y.fecha);
  out.turnos = union('turnos');
  out.adjuntos = union('adjuntos');
  out.cirugias = union('cirugias');
  out.pedidos = union('pedidos').sort((x, y) => (x.creado || 0) - (y.creado || 0));
  out.certificados = union('certificados').sort((x, y) => (x.creado || 0) - (y.creado || 0));
  return out;
}
function changePass(){
  openModal('Cambiar clave maestra', `<form id="cpF">
    <label class="f"><span>Clave actual</span><input class="i" type="password" id="cp0" required></label>
    <label class="f"><span>Nueva clave (mín. 8)</span><input class="i" type="password" id="cp1" required minlength="8"></label>
    <label class="f"><span>Repetir nueva clave</span><input class="i" type="password" id="cp2" required></label>
    <div id="cpErr" class="alert danger hidden"></div>
    <div class="actions"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" id="cpOk">Cambiar</button></div></form>`);
  $('#cpF').onsubmit = async e => { e.preventDefault(); const err = $('#cpErr');
    const fail = m => { err.textContent = m; err.classList.remove('hidden'); $('#cpOk').disabled = false; };
    $('#cpOk').disabled = true;
    if (!await checkPass($('#cp0').value, await DB.getMeta('salt'), await DB.getMeta('verifier'))) return fail('La clave actual no es correcta.');
    if ($('#cp1').value.length < 8) return fail('La nueva clave debe tener al menos 8 caracteres.');
    if ($('#cp1').value !== $('#cp2').value) return fail('Las claves nuevas no coinciden.');
    if (Sync.enabled()){
      try { await Sync.changePassword($('#cp0').value, $('#cp1').value); } catch(e){ return fail(e.message); }
      closeModal(); toast('Clave cambiada en la cuenta. En los otros dispositivos te va a pedir la clave nueva.'); return;
    }
    const salt = crypto.getRandomValues(new Uint8Array(16)); const nk = await deriveKey($('#cp1').value, salt);
    await DB.setMeta('dk', await wrapDK(DKRAW, nk)); await DB.setMeta('salt', b64(salt)); await DB.setMeta('verifier', await enc(VERIF, nk));
    UKEY = nk; closeModal(); toast('Clave cambiada. Descargá un respaldo nuevo.'); };
}

    <p>${[p.dni ? 'DNI ' + esc(fmtDNI(p.dni)) : '', p.nacimiento ? 'Nac. ' + fmtDate(p.nacimiento) + ' (' + edad(p.nacimiento) + ')' : '', esc(p.obraSocial) + (p.nroAfiliado ? ' Nº ' + esc(p.nroAfiliado) : ''), esc(p.telefono)].filter(Boolean).join(' · ')}</p>
    ${p.alergias ? `<p><b>ALERGIAS:</b> ${esc(p.alergias)}</p>` : ''}

    <p style="margin-top:24px;font-size:10pt">Impreso el ${fmtDT(Date.now())}</p>`;
  window.print();

/* ===================== Ayuda ===================== */
function help(){
  openModal('Cómo se usa', `<ol style="padding-left:20px;margin-top:0">
    <li><b>Buscar:</b> escribí parte del apellido, nombre, DNI, teléfono u obra social. Enter abre el primero.</li>
    <li><b>Turno por WhatsApp:</b> copiá el mensaje del paciente, tocá 💬 WhatsApp, pegá y “Analizar”. Revisá y guardá. Si el paciente ya existe, el turno se le agrega.</li>
    <li><b>Evolucionar:</b> abrí al paciente, tocá el 🎤 y dictá. Decí “punto”, “coma”, “nuevo párrafo”. Tocá de nuevo el 🎤 para parar y “Guardar evolución”.</li>
    <li><b>Seguridad:</b> todo queda cifrado (AES-256) con tu clave maestra. Se bloquea sola a los ${AUTOLOCK_MIN} minutos sin uso.</li>
    <li><b>Estudios:</b> en la ficha del paciente, 📷 saca una foto (por ejemplo de una placa) y 📎 agrega fotos, PDF o archivos DICOM. Con “Abrir en IDV” el estudio se envía a IDV u otro visor DICOM del iPhone o iPad.</li>
    <li><b>PACS del hospital:</b> “🏥 Ver en PACS” abre el portal con el DNI copiado; si descargás el estudio desde ahí, cargalo con 📎 para que quede en la ficha.</li>
    <li><b>Varios dispositivos:</b> en 🌐 conectá cada equipo con el mismo email y clave maestra. Los cambios se sincronizan solos; si no hay internet, se suben al volver la conexión.</li>
    <li><b>Respaldo:</b> descargá el respaldo cifrado al menos una vez por semana y guardalo fuera del equipo. Sirve también para pasar los datos a otro dispositivo.</li></ol>
    <div class="alert warn">El dictado usa el reconocimiento de voz del navegador (Chrome/Edge envían el audio a Google/Microsoft para transcribir). Los datos guardados nunca salen del dispositivo.</div>
    <div class="actions"><button class="btn pri" data-act="close">Entendido</button></div>`);
}

  if (el.tagName === 'SELECT') return;
  if (a !== 'menu') $('#menu') && $('#menu').classList.add('hidden');

  switch (a){
    case 'home': closeModal(); go('home'); break;
    case 'turnos': go('turnos'); break;
    case 'tday': App.turnosDate = el.dataset.d; renderTurnos(); break;
    case 'menu': $('#menu').classList.toggle('hidden'); break;
    case 'lock': lock(); break;
    case 'equipo': teamPanel(); break;
    case 'uso': usoPanel(); break;
    case 'nun': nunModal(); break;
    case 'estad': estadisticaModal(); break;
    case 'cir-nueva': cirugiaModal(); break;
    case 'cir-ver': cirugiaModal(el.dataset.cid); break;
    case 'tog-estado': togEstado(el.dataset.pid, el.dataset.tid); break;
    case 'sync': syncPanel(); break;
    case 'help': help(); break;
    case 'export': exportBackup(); break;
    case 'import': importBackup(); break;
    case 'chpass': changePass(); break;
    case 'wa': openWhatsApp(); break;
    case 'lista': openLista(); break;
    case 'close': closeModal(); break;
    case 'mic': Dict.toggle(el); break;
    case 'newp': { const q = (App.view === 'home' && $('#q')) ? $('#q').value.trim() : ''; const pre = {};
      if (/^\d[\d.]{6,}$/.test(q)) pre.dni = digits(q); else if (q) { const [ap, no] = splitName(q.includes(',') ? q : q.split(' ').length > 1 ? q.split(' ').slice(1).join(' ') + ', ' + q.split(' ')[0] : q); pre.apellido = titleCase(q.split(' ').length > 1 && !q.includes(',') ? q.split(' ')[0] : ap); pre.nombre = titleCase(q.split(' ').length > 1 && !q.includes(',') ? q.split(' ').slice(1).join(' ') : no); }
      patientForm(newPatient(pre), 'Nuevo paciente', p => { App.lastQuery = ''; go('patient', p.id); }); break; }
    case 'openp': closeModal(); go('patient', el.dataset.pid); break;
    case 'editp': patientForm(byId(App.current), 'Datos del paciente', () => renderPatient()); break;
    case 'newturno': turnoForm(byId(App.current)); break;

    case 'pacscfg': pacsConfig(); break;

    case 'adj-file': pickFiles('file'); break;
    case 'adj-dir': pickFiles('dir'); break;
    case 'adj-open': openAdj(el.dataset.aid); break;
  }
});
document.addEventListener('click', e => { const li = e.target.closest('li[data-pid]'); if (li && !e.target.closest('[data-act]')) go('patient', li.dataset.pid); });
document.addEventListener('change', async e => {
  const el = e.target; if (el.dataset.act !== 'estado') return;
  const p = byId(App.current); const t = p.turnos.find(x => x.id === el.dataset.tid); t.estado = el.value; await savePatient(p); toast('Turno: ' + el.value);
});
document.addEventListener('keydown', e => {
  App.lastActivity = Date.now();
  if (e.key === 'Escape') closeModal();
  if (e.key === '/' && KEY && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); if (App.view !== 'home') go('home'); setTimeout(() => $('#q') && $('#q').focus(), 0); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && document.activeElement && document.activeElement.id === 'evoText'){ e.preventDefault(); saveEvo(); }
});
['pointerdown','input','scroll'].forEach(ev => document.addEventListener(ev, () => App.lastActivity = Date.now(), { passive: true, capture: true }));
setInterval(() => { if (KEY && Date.now() - App.lastActivity > AUTOLOCK_MIN * 60000) lock(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!KEY) return; if (document.hidden){ saveDraftFromUI(); persistDrafts().catch(() => {}); } else Sync.sync(); });
document.addEventListener('focusout', () => setTimeout(() => { if (App.needsRender) refreshView(); }, 200));
window.addEventListener('online', () => KEY && Sync.sync());
window.addEventListener('offline', () => KEY && Sync.setStatus('offline'));
setInterval(() => { if (KEY) Sync.sync(); }, 30000);

boot();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
